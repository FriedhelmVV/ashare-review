<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>F(X)=Y的复盘工作台</title>
<style>
:root{
  --bg:#0a0e13; --bg2:#0e141c; --panel:#131b25; --panel2:#18222e; --panel3:#1e2a38;
  --line:#233040; --line2:#2e3f52;
  --txt:#e7eef6; --txt2:#a9b8c8; --dim:#6f8092; --dim2:#4d5c6b;
  --up:#f2464a; --up-bg:rgba(242,70,74,.13);
  --down:#12b57f; --down-bg:rgba(18,181,127,.13);
  --flat:#8b9bab;
  --gold:#e8a33d; --blue:#4c8dff; --cyan:#22c1c3; --violet:#9b6bff;
  --r:10px;
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,Consolas,"Cascadia Mono",Menlo,monospace;
  /* 底色主题扩展色（只随明暗变，与涨跌语义无关） */
  --bgGlow:#16202c; --btnHoverLine:#3d4c60; --scroll:#2b3948; --scrollHover:#3a4c60;
  --ok:#3fd39d; --warn:#ff7a7d; --onAccent:#0d1218; --upSoft:#ff8a8c; --linkHover:#7fb0ff;
  --chartLine:#3a4c60; --chartTxt:#4d5c6b; --segFlat:#3a4c60; --segFlatTxt:#cbd5e1;
  --topBg:rgba(10,14,19,.9);
}
/* ═══ 网页底色主题：只覆盖变量，不改任何结构 ═══ */
html[data-theme="light"]{
  --bg:#f2f4f8; --bg2:#e9ecf2; --panel:#ffffff; --panel2:#f6f8fb; --panel3:#eef1f6;
  --line:#dde3ec; --line2:#c9d2df;
  --txt:#131a24; --txt2:#4a5768; --dim:#6f7c8f; --dim2:#9aa5b5;
  --up:#d92626; --up-bg:rgba(217,38,38,.10);
  --down:#0a8f5f; --down-bg:rgba(10,143,95,.10);
  --flat:#7b8798;
  --gold:#b57508; --blue:#2563eb; --cyan:#0e8f91; --violet:#7c4dff;
  --bgGlow:#dfe5ee; --btnHoverLine:#b9c4d4; --scroll:#c9d2df; --scrollHover:#aab6c8;
  --ok:#0a8f5f; --warn:#d92626; --onAccent:#ffffff; --upSoft:#c0282f; --linkHover:#2563eb;
  --chartLine:#dde3ec; --chartTxt:#78859a; --segFlat:#d5dbe5; --segFlatTxt:#4a5768;
  --topBg:rgba(255,255,255,.88);
}
html[data-theme="paper"]{
  --bg:#f6f1e5; --bg2:#efe8d8; --panel:#fffdf7; --panel2:#f8f3e6; --panel3:#f1e9d8;
  --line:#e0d6c0; --line2:#cbbea2;
  --txt:#33302a; --txt2:#6a6355; --dim:#8a8171; --dim2:#b0a693;
  --up:#b5322d; --up-bg:rgba(181,50,45,.10);
  --down:#2c7a52; --down-bg:rgba(44,122,82,.10);
  --flat:#8b8271;
  --gold:#9a6a12; --blue:#2b5f9e; --cyan:#1f7d80; --violet:#7a4f9c;
  --bgGlow:#e8dfcb; --btnHoverLine:#c3b696; --scroll:#d8cdb4; --scrollHover:#bcb094;
  --ok:#2c7a52; --warn:#b5322d; --onAccent:#fffdf7; --upSoft:#a03a33; --linkHover:#2b5f9e;
  --chartLine:#e0d6c0; --chartTxt:#968d7c; --segFlat:#ded4bf; --segFlatTxt:#6a6355;
  --topBg:rgba(255,253,247,.9);
}
html[data-theme="slate"]{
  --bg:#0f1b2d; --bg2:#0b1524; --panel:#16263c; --panel2:#1b2e48; --panel3:#213752;
  --line:#273c58; --line2:#35506f;
  --txt:#e6eefb; --txt2:#a4bad6; --dim:#7e93b0; --dim2:#5d7695;
  --up:#ff6b6b; --up-bg:rgba(255,107,107,.13);
  --down:#2ecc9b; --down-bg:rgba(46,204,155,.13);
  --flat:#8fa6c2;
  --gold:#f0b45a; --blue:#63a4ff; --cyan:#3fc9cb; --violet:#a98bff;
  --bgGlow:#16263c; --btnHoverLine:#3d5878; --scroll:#2c4463; --scrollHover:#3c5a80;
  --ok:#2ecc9b; --warn:#ff6b6b; --onAccent:#08131f; --upSoft:#ff9c9c; --linkHover:#8fc0ff;
  --chartLine:#2c4463; --chartTxt:#7288a5; --segFlat:#2c4463; --segFlatTxt:#c9d9ee;
  --topBg:rgba(11,21,36,.9);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 600px at 15% -8%,var(--bgGlow) 0%,var(--bg) 55%) fixed,var(--bg);
  color:var(--txt);font-family:var(--font);font-size:13px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
button{font-family:inherit;font-size:12px;cursor:pointer;color:var(--txt2);background:var(--panel2);
  border:1px solid var(--line2);border-radius:7px;padding:5px 11px;transition:.15s}
button:hover{background:var(--panel3);color:var(--txt);border-color:var(--btnHoverLine)}
select,input,textarea{font-family:inherit;font-size:12px;color:var(--txt);background:var(--panel2);
  border:1px solid var(--line2);border-radius:7px;padding:5px 9px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollHover)}
::-webkit-scrollbar-track{background:transparent}

/* ── 顶栏 ───────────────────────────────── */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;background:var(--topBg);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;font-weight:700;
  background:linear-gradient(140deg,#f2464a,#e8a33d);color:#12181f;box-shadow:0 3px 14px rgba(242,70,74,.3)}
.brand h1{font-size:15px;font-weight:650;letter-spacing:.2px}
.brand p{font-size:11px;color:var(--dim);margin-top:-1px}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--line2);color:var(--txt2);background:var(--panel2);white-space:nowrap}
.badge.live{border-color:rgba(18,181,127,.5);color:var(--ok);background:rgba(18,181,127,.09)}
.badge.seed{border-color:rgba(232,163,61,.45);color:var(--gold);background:rgba(232,163,61,.09)}
.badge.warn{border-color:rgba(242,70,74,.45);color:var(--warn);background:var(--up-bg)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}

.wrap{max-width:1680px;margin:0 auto;padding:16px 18px 60px}

/* ── 概览 ───────────────────────────────── */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:stretch}
@media(max-width:1080px){.ov{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.card h3{font-size:12px;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:7px;margin-bottom:11px}
.card h3::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--blue)}
.card h3 .hint{font-weight:400;font-size:10.5px;color:var(--dim2);margin-left:auto}

.idxstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.idx{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;position:relative;overflow:hidden}
.idx::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--flat)}
.idx.up::after{background:var(--up)} .idx.down::after{background:var(--down)}
.idx .nm{font-size:11.5px;color:var(--txt2);display:flex;justify-content:space-between;gap:6px}
.idx .nm em{font-style:normal;font-size:10px;color:var(--dim2);font-family:var(--mono)}
.idx .cl{font-size:17px;font-weight:600;margin:2px 0 1px}
.idx .sub{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}
.idx .pc{font-size:12.5px;font-weight:600;font-family:var(--mono)}

/* 情绪温度计 */
.gauge{display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge .score{font-size:30px;font-weight:700;font-family:var(--mono);line-height:1;margin-top:-14px;letter-spacing:-1px}
.gauge .stage{font-size:15px;font-weight:700;letter-spacing:3px;margin-top:5px}
.gauge .gl{font-size:10.5px;color:var(--dim)}
.rail{display:flex;gap:3px;width:100%;margin-top:9px}
.rail span{flex:1;text-align:center;font-size:10px;padding:3px 0;border-radius:5px;
  background:var(--panel2);color:var(--dim2);border:1px solid transparent;transition:.2s}
.rail span.on{font-weight:600;color:var(--onAccent)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.kpi .k{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:4px}
.kpi .v{font-size:19px;font-weight:650;line-height:1.25;font-family:var(--mono)}
.kpi .d{font-size:10.5px;color:var(--dim2)}

/* ── Tabs ───────────────────────────────── */
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;
  padding:8px 15px;font-size:13px;color:var(--dim)}
.tabs button:hover{background:transparent;color:var(--txt2)}
.tabs button.on{color:var(--txt);border-bottom-color:var(--up);font-weight:600}
.panel{display:none}
.panel.on{display:block;animation:fade .22s ease}
/* 只用位移做入场：即使动画不推进（无合成帧 / prefers-reduced-motion），内容也始终可见 */
@keyframes fade{from{transform:translateY(4px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;align-items:start}
/* 手机（<560px）：minmax(380px) 会让卡片至少 380px 宽；更要命的是宽表格的
   min-content 宽度（逐日明细表约 372px）会把卡片顶到 404px，在 390px 屏上撑出
   横向滚动（实测 iframe 390px：scrollWidth 414 vs 视口 381）。
   两条一起改：① 单列 1fr + 卡片 min-width:0 允许收缩；② 表格自己在卡片内横向滚动。 */
@media(max-width:560px){
  .wrap{padding:10px 10px 40px}
  .grid2,.grid3{grid-template-columns:1fr}
  .grid2>.card,.grid3>.card,.card{min-width:0}
  .col{min-width:170px}
  table{display:block;overflow-x:auto;font-size:11px}
}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}

/* ── 表格 ───────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;padding:6px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap;position:relative}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--txt2)}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:rgba(76,141,255,.05)}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.code{font-family:var(--mono);font-size:10.5px;color:var(--dim2)}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;
  background:var(--panel3);color:var(--txt2);border:1px solid var(--line2)}
.bar{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden;min-width:44px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.rank{font-family:var(--mono);color:var(--dim);font-size:10.5px}

/* 涨停梯队（天梯）：左边一列板高、右边四列个股卡片 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.tile .tn{font-size:12.5px;font-weight:600}
.tile .tn em{font-style:normal;color:var(--dim);font-size:11px;font-family:var(--mono);margin-left:3px}
.tile .ta{font-size:10.5px;color:var(--dim);margin-top:2px;font-family:var(--mono)}
.lt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lt-row{display:flex;background:var(--panel)}
.lt-row+.lt-row{border-top:1px solid var(--line)}
.lt-rail{flex:0 0 74px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 6px;
  font-size:12px;font-weight:600;color:var(--txt2);background:var(--panel2);border-right:1px solid var(--line)}
.lt-rail.top{color:var(--upSoft);background:linear-gradient(180deg,rgba(242,70,74,.16),rgba(242,70,74,.02))}
.lt-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);min-width:0}
.chip{background:var(--panel);padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:.14s}
.chip:hover{background:var(--panel3)}
.chip .lt-top{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);font-family:var(--mono);min-height:12px}
.chip .lt-top .lt-str{color:var(--upSoft);font-weight:600}
.chip .lt-top .lt-amt{margin-left:auto}
.chip .lt-top .lt-time{color:var(--txt2);letter-spacing:.02em}
.chip .lt-top .lt-time.one{color:var(--gold)}
.chip>b{font-size:14px;font-weight:700;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .lt-tag{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-empty{background:var(--panel)}
@media(max-width:820px){.lt-grid{grid-template-columns:repeat(2,1fr)}.lt-rail{flex-basis:54px;font-size:11px}.chip>b{font-size:13px}}

/* 分项条 */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:74px 1fr 46px;gap:9px;align-items:center;font-size:11.5px}
.row .lbl{color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;font-family:var(--mono);font-weight:600}
.row .dt{grid-column:2/4;font-size:10px;color:var(--dim2);margin-top:-5px}

/* 梯队柱状 */
.hbars{display:flex;align-items:flex-end;gap:9px;height:126px;padding:0 2px}
.hbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.hbar .b{width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#f2464a,#8f2a2d);min-height:3px;
  position:relative;transition:.25s}
.hbar:hover .b{filter:brightness(1.25)}
.hbar .n{font-size:12px;font-weight:650;font-family:var(--mono)}
.hbar .t{font-size:10px;color:var(--dim);white-space:nowrap}

/* 选股 */
.pickbar{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.pickbar button{background:var(--panel);border:1px solid var(--line);color:var(--txt2);font-size:11.5px;
  padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit}
.pickbar button:hover{color:var(--txt);border-color:var(--line2)}
.pickbar button em{font-style:normal;color:var(--dim2);margin-left:5px;font-size:10.5px;font-family:var(--mono)}
.pickbar button.on{background:var(--up-bg);border-color:rgba(242,70,74,.45);color:var(--upSoft);font-weight:600}
.pickbar button.on em{color:var(--upSoft)}
.pdesc{font-size:11px;color:var(--dim2);margin:0 0 9px;line-height:1.6}
.pmeta{font-size:10.5px;color:var(--dim2);line-height:1.7}
.sb{color:var(--up);font-weight:650;font-family:var(--mono);font-size:12px}
.sb1{color:var(--gold);font-size:11.5px}
.why{color:var(--txt2);font-size:11px;line-height:1.5}
.tbl td .cd{display:block;font-size:10px;color:var(--dim2);font-family:var(--mono);margin-top:1px}

/* 消息面 */
.newslist{display:flex;flex-direction:column;gap:0}
.news,.orph{display:grid;grid-template-columns:42px 1fr;gap:11px;padding:10px 2px;border-bottom:1px solid rgba(35,48,64,.55)}
.news:last-child,.orph:last-child{border-bottom:none}
.heat{text-align:center}
.heat b{display:block;font-size:14px;font-family:var(--mono);line-height:1.1}
.heat i{display:block;height:3px;border-radius:2px;background:var(--panel3);margin-top:4px;overflow:hidden}
.heat i>em{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--up))}
.news .ti,.orph .ti{font-size:12.5px;color:var(--txt);text-decoration:none;display:block}
.news .ti:hover,.orph .ti:hover{color:var(--linkHover)}
.news .mt,.orph .mt{display:flex;gap:9px;align-items:center;font-size:10.5px;color:var(--dim);margin-top:3px;flex-wrap:wrap}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.filters button.on{background:var(--up-bg);border-color:rgba(242,70,74,.45);color:var(--upSoft)}

/* ── 图表（趋势模块） ───────────────────── */
.chart{width:100%;display:block}
.chart text{fill:var(--dim);font-size:10px;font-family:var(--mono)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:rgba(35,48,64,.55);stroke-width:1;stroke-dasharray:2 4}
.chart .zl{stroke:var(--line2);stroke-width:1}
.chart .ttl{fill:var(--txt2);font-size:10.5px;font-family:var(--font)}
.chart .hit{fill:transparent;cursor:crosshair}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 6px;font-size:11px;color:var(--txt2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend em{color:var(--dim);font-style:normal;font-family:var(--mono)}
.segs{display:flex;gap:4px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.segs button{padding:3px 11px;font-size:11px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--txt2);cursor:pointer;font-family:var(--font)}
.segs button:hover{border-color:var(--line2);color:var(--txt)}
.segs button.on{background:var(--panel3);color:var(--txt);border-color:var(--line2)}
.segs .sp{margin-left:auto;font-size:10.5px;color:var(--dim2)}
.tw{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.stat .k{font-size:10.5px;color:var(--dim);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:15px;font-weight:650;font-family:var(--mono);line-height:1.15;color:var(--txt)}
.stat .v.up{color:var(--up)}.stat .v.down{color:var(--down)}
.stat .s{font-size:10.5px;color:var(--dim2);margin-top:4px;font-family:var(--mono)}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;white-space:nowrap}
.tbl th{color:var(--dim);font-weight:500;text-align:right;padding:6px 9px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:6px 9px;border-bottom:1px solid rgba(35,48,64,.45);font-family:var(--mono)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:hover td{background:rgba(35,48,64,.3)}
.tbl td.dimv{color:var(--dim2)}
/* 竞价时点单元格：上行虚拟匹配价、下行未匹配量（正=买盘剩余、负=卖盘剩余） */
.slot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.22}
.slot .p{font-weight:650;font-size:12px}
.slot .u{font-size:10.5px;color:var(--dim2)}
.tbl td.amtx{font-size:12.5px;font-weight:650;color:var(--gold)}
.tbl td.rkx{color:var(--dim2);font-size:10.5px}
.tbl td.sc{text-align:left;font-family:inherit}
.tbl td.indx{text-align:right;font-family:inherit;color:var(--txt2);font-size:11px}
.newm{color:var(--gold);font-size:9px;margin-left:1px;vertical-align:super}

/* 笔记 */
.note{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;min-height:96px;resize:vertical;line-height:1.7;font-size:12.5px}
.note::placeholder{color:var(--dim2)}
.lbl2{font-size:11.5px;color:var(--txt2);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.lbl2 em{font-style:normal;font-size:10px;color:var(--dim2)}
.empty{color:var(--dim2);font-size:12px;padding:16px 4px;text-align:center}
.warnlist{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--dim)}
.warnlist div::before{content:"▸ ";color:var(--gold)}
.missing{display:flex;flex-wrap:wrap;gap:5px}
.missing span{font-size:10.5px;padding:2px 7px;border-radius:5px;background:rgba(242,70,74,.09);
  border:1px solid rgba(242,70,74,.25);color:var(--upSoft);font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt2)}
.sw{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--txt2)}
.sw input[type=range]{flex:1;padding:0;background:transparent;border:none}
.wl{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.wl .it{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:5px 9px;font-size:12px}
.wl .it b{font-weight:600} .wl .it .x{margin-left:auto;color:var(--dim2);cursor:pointer;padding:0 4px}
.wl .it .x:hover{color:var(--up)}
.mt14{margin-top:14px}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel3);
  border:1px solid var(--line2);color:var(--txt);padding:8px 16px;border-radius:9px;font-size:12px;z-index:200;
  box-shadow:0 8px 26px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;bottom:36px}
/* 网页底色切换 */
.themebar{display:flex;gap:1px;padding:2px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2);align-items:center}
.themebar button{border:0;background:transparent;color:var(--dim);font-size:11px;padding:4px 9px;border-radius:999px;
  line-height:1.25;white-space:nowrap;transition:.15s;border-radius:999px}
.themebar button:hover{background:transparent;color:var(--txt)}
.themebar button.on{background:var(--txt);color:var(--bg);font-weight:700}
.themebar .sw{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:0;margin-right:4px;
  border:1px solid rgba(128,128,128,.45)}
@media (max-width:1240px){.themebar .lb{display:none}.themebar button{padding:4px 7px}.themebar .sw{margin-right:0}}

        --line:#ccc;--line2:#bbb;--txt:#111;--txt2:#333;--dim:#555;--dim2:#777}
  .top{position:static;background:#fff;border-bottom:1px solid #ccc}
  .tr,.tabs,.filters,.toast{display:none!important}

.tt{font-style:normal;font-size:9px;line-height:14px;padding:0 4px;border-radius:3px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.tt-h{background:rgba(34,193,195,.15);color:var(--cyan)}

/* 板块涨幅榜：中轴对称发散条，红涨（向右）绿跌（向左）。
   两列按列填充（grid-auto-flow:column），视觉上「第 1 名往下排完再排第二列」，
   读起来是一张榜，而不是横着跳的非连续序。行数由 JS 按条目数算好写进行内样式。 */
.secgrid{display:grid;grid-auto-flow:column;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 26px}
.srow{display:grid;grid-template-columns:78px 1fr 54px;gap:8px;align-items:center;font-size:11.5px;padding:1.5px 0}
.srow .snm{color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sbar{position:relative;height:9px;background:var(--panel3);border-radius:3px}
.sbar:before{content:'';position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--line)}
.sbar>i{position:absolute;top:0;bottom:0}
.sbar>i.p{background:linear-gradient(90deg,#c0303a,#f2464a);border-radius:0 3px 3px 0}
.sbar>i.n{background:linear-gradient(270deg,#0f8f66,#12b57f);border-radius:3px 0 0 3px}
.srow .spc{text-align:right;font-size:11px}

.nsum{font-size:11.5px;color:var(--txt2);line-height:1.65;margin-top:4px;cursor:pointer;

.ti.orph-ti{color:var(--txt2);cursor:default;font-size:12.5px;line-height:1.5}

<script>
(function(){
'use strict';

/* ═══════════ 常量 ═══════════ */
var PHASES=['冰点','修复','发酵','高潮','退潮'];
var PHASE_COLOR={'冰点':'#4c8dff','修复':'#22c1c3','发酵':'#e8a33d','高潮':'#f2464a','退潮':'#9b6bff'};
var LS_NOTES='rv:notes:v1', LS_UI='rv:ui:v1';

/* ═══════════ 工具 ═══════════ */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isN(v){return v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));}
function num(v,d){d=d==null?2:d;return isN(v)?Number(v).toFixed(d):'—';}
function int(v){return isN(v)?String(Math.round(Number(v))):'—';}
function pct(v,d){d=d==null?2:d;if(!isN(v))return '—';var x=Number(v);return (x>0?'+':'')+x.toFixed(d)+'%';}
function cls(v){return !isN(v)?'flat':(Number(v)>0?'up':(Number(v)<0?'down':'flat'));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function sum(a){return a.reduce(function(x,y){return x+(Number(y)||0);},0);}
/** 时间戳统一成 +08:00 展示；数据文件里混有 UTC 的 Z 结尾格式 */
function normTs(s){
  if(!s)return null;
  var t=String(s);
  if(/Z$/.test(t)){
    var ms=Date.parse(t);
    if(isFinite(ms))return new Date(ms+8*3600*1000).toISOString().replace(/\.\d+Z$/,'+08:00');
  }
  return t;
}
/** 复盘文本框按内容自动撑高：写长复盘时不该被 96px 的框困住，打印时也能完整输出 */
function autoGrow(t){
  if(!t||t.tagName!=='TEXTAREA')return;
  t.style.height='auto';
  t.style.height=Math.max(96,t.scrollHeight+2)+'px';
}
function toast(m){var t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},1900);}
function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ═══ 网页底色（四套预设，存在 localStorage） ═══ */
var THEME_KEY='rv.theme';
var THEMES=['dark','light','paper','slate'];
function applyTheme(t){
  if(THEMES.indexOf(t)<0) t='dark';
  document.documentElement.setAttribute('data-theme',t);
  try{
    var bs=document.querySelectorAll('#themeBar button');
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on',bs[i].getAttribute('data-theme')===t);
    var meta=document.querySelector('meta[name=color-scheme]');
    if(meta) meta.setAttribute('content',(t==='light'||t==='paper')?'light dark':'dark light');
  }catch(e){}
  lsSet(THEME_KEY,t);
  try{RV.theme=t;}catch(e){}
}

/* ═══════════ 状态 ═══════════ */
var RV={
  days:{},        // date -> normalized Day
  order:[],       // 日期升序
  manifest:[],    // 原始 manifest
  date:null,
  notes:lsGet(LS_NOTES,{}),
  reviewFiles:{}, // date -> data/<date>.review.js 里的 window.RV_REVIEW（现仅用于标注：题材备注/消息批注/情绪覆写）
  reviewSeeded:{},// date -> 该日是否已从复盘文件导入过
  history:null,   // data/history.js 里的 window.RV_HISTORY（多日序列）
  ui:lsGet(LS_UI,{tab:'index',stockView:'ladder',pickMode:'mainline',newsTag:'全部',sortKey:'amount',sortDir:-1,trendWin:20}),
  origin:'—'
};
/** 笔记的空结构。注意 phase 是「情绪周期阶段人工覆写」，不属于数据层 */
function blankNotes(){
  return {summary:'',plan:'',risks:'',mood:null,phase:null,
          themeNote:{},newsNote:{},newsAdd:[],watch:[],_from:'local'};
}
function notesOf(d){
  if(!RV.notes[d])RV.notes[d]=blankNotes();
  var n=RV.notes[d];
  n.themeNote=n.themeNote||{};n.newsNote=n.newsNote||{};n.newsAdd=n.newsAdd||[];n.watch=n.watch||[];
  if(!('phase' in n))n.phase=null;
  if(!('mood' in n))n.mood=null;
  return n;
}
/**
 * 把 data/<date>.review.js 的内容作为该日的初始笔记。
 * 只在「该日本地完全没有笔记」时导入 —— 之后一律以用户的本地编辑为准，
 * 避免你改过之后又被文件覆盖回去。想重新导入用「重载复盘」按钮。
 */
function seedReviews(force){
  var n=0;
  Object.keys(RV.reviewFiles).forEach(function(dt){
    if(!RV.reviewFiles[dt])return;
    if(RV.notes[dt]&&!force)return;
    n+=reloadReview(dt);
  });
  return n;
}
/** 用复盘文件覆盖指定日期的笔记（「重载复盘」按钮用） */
function reloadReview(dt){
  var r=RV.reviewFiles[dt];
  if(!r||typeof r!=='object')return 0;
  var base=blankNotes();
  for(var k in r){if(k.charAt(0)==='_')continue;base[k]=r[k];}
  base._from='file';
  RV.notes[dt]=base;
  saveNotes();
  return 1;
}
function saveNotes(){lsSet(LS_NOTES,RV.notes);}
function saveUI(){lsSet(LS_UI,RV.ui);}

/* ═══════════ 归一化 ═══════════ */
function normDay(d){
  d=d||{};

      items:Array.isArray(idx.items)?idx.items.filter(function(x){return x&&x.code;}):[],
      totalAmount:isN(idx.totalAmount)?Number(idx.totalAmount):null,
      prevAmount:isN(idx.prevAmount)?Number(idx.prevAmount):null,
      amountDeltaPct:isN(idx.amountDeltaPct)?Number(idx.amountDeltaPct):null,
      breadth:{
        up:isN((idx.breadth||{}).up)?Number(idx.breadth.up):null,
        down:isN((idx.breadth||{}).down)?Number(idx.breadth.down):null,
        flat:isN((idx.breadth||{}).flat)?Number(idx.breadth.flat):null,
        total:isN((idx.breadth||{}).total)?Number(idx.breadth.total):null
      }
    },
    sentiment:{
      limitUpCount:isN(sen.limitUpCount)?Number(sen.limitUpCount):null,
      limitDownCount:isN(sen.limitDownCount)?Number(sen.limitDownCount):null,
      brokenCount:isN(sen.brokenCount)?Number(sen.brokenCount):null,
      brokenRate:isN(sen.brokenRate)?Number(sen.brokenRate):null,
      maxStreak:isN(sen.maxStreak)?Number(sen.maxStreak):null,
      streakDist:(sen.streakDist&&typeof sen.streakDist==='object')?sen.streakDist:{},
      limitUpAmount:isN(sen.limitUpAmount)?Number(sen.limitUpAmount):null,
      promotion:Object.assign({'1to2':null,'2to3':null,'3to4':null,highToHigh:null,overall:null},sen.promotion||{}),
      prevLimitUpCount:isN(sen.prevLimitUpCount)?Number(sen.prevLimitUpCount):null,
      killCount:isN(sen.killCount)?Number(sen.killCount):null,
      scoreOverride:isN(sen.scoreOverride)?Number(sen.scoreOverride):null,
      phaseOverride:sen.phaseOverride||null
    },
    themes:Array.isArray(d.themes)?d.themes.filter(function(t){return t&&t.name;}):[],
    sectors:Array.isArray(d.sectors)?d.sectors.filter(function(x){return x&&x.name&&isN(x.pct);})
      .map(function(x){return {name:x.name,code:x.code||null,pct:Number(x.pct)};}):[],
    stocks:{
      ladder:Array.isArray(st.ladder)?st.ladder.filter(function(g){return g&&Array.isArray(g.items);}):[],
      topAmount:Array.isArray(st.topAmount)?st.topAmount:[],
      broken:Array.isArray(st.broken)?st.broken:[],
      limitDown:Array.isArray(st.limitDown)?st.limitDown:[],
      watchlist:Array.isArray(st.watchlist)?st.watchlist:[]
    },
    news:{items:Array.isArray(nw.items)?nw.items:[],manual:Array.isArray(nw.manual)?nw.manual:[]},
    auction:(function(a){
      if(!a||!Array.isArray(a.items)||!a.items.length)return null;
      return {
        count:isN(a.count)?Number(a.count):a.items.length,
        amountSum:isN(a.amountSum)?Number(a.amountSum):null,
        marketCount:isN(a.marketCount)?Number(a.marketCount):null,
        note:a.note||'',
        items:a.items.filter(function(x){return x&&x.code;}).map(function(x){
          return {
            code:x.code,name:x.name,industry:x.industry||'',
            amount:isN(x.amount)?Number(x.amount):null,
            rank:isN(x.rank)?Number(x.rank):null,
            rankBase:isN(x.rankBase)?Number(x.rankBase):null,
            volume:isN(x.volume)?Number(x.volume):null,
            slots:Array.isArray(x.slots)?x.slots.map(function(s){
              return {time:s.time,
                bid:isN(s.bid)?Number(s.bid):null,
                ask:isN(s.ask)?Number(s.ask):null,
                unmatched:isN(s.unmatched)?Number(s.unmatched):null,
                unmatchedAmount:isN(s.unmatchedAmount)?Number(s.unmatchedAmount):null,
                pct:isN(s.pct)?Number(s.pct):null};
            }):[]
          };
        })
      };
    })(d.auction),
    picks:(function(p){
      if(!p||!Array.isArray(p.modes)||!p.modes.length)return null;
      return {
        date:p.date||null,
        generatedAt:normTs(p.generatedAt),
        prevDate:p.prevDate||null,
        rulesVersion:isN(p.rulesVersion)?Number(p.rulesVersion):null,
        universe:isN(p.universe)?Number(p.universe):null,
        modes:p.modes.filter(function(m){return m&&m.id;}).map(function(m){
          return {
            id:m.id,name:m.name||m.id,desc:m.desc||'',
            total:isN(m.total)?Number(m.total):0,
            limit:isN(m.limit)?Number(m.limit):0,
            items:(Array.isArray(m.items)?m.items:[]).filter(function(x){return x&&x.code;}).map(function(x){
              return {
                code:x.code,name:x.name,industry:x.industry||'',theme:x.theme||'',
                streak:isN(x.streak)?Number(x.streak):0,
                limitUp:isN(x.limitUp)?Number(x.limitUp):0,
                prevStreak:isN(x.prevStreak)?Number(x.prevStreak):0,
                prevMaxStreak:isN(x.prevMaxStreak)?Number(x.prevMaxStreak):0,
                isPromoted:isN(x.isPromoted)?Number(x.isPromoted):0,
                isFanbao:isN(x.isFanbao)?Number(x.isFanbao):0,
                amount:isN(x.amount)?Number(x.amount):null,
                turnover:isN(x.turnover)?Number(x.turnover):null,
                amountRank:x.amountRank||null,
                pct:isN(x.pct)?Number(x.pct):null,

  // 由明细推导：limitUp 平铺数组 → ladder
  if(!out.stocks.ladder.length&&Array.isArray(st.limitUp)&&st.limitUp.length){

    if(am>0)out.sentiment.limitUpAmount=Math.round(am*100)/100;
  }
  if(out.index.totalAmount===null&&out.index.items.length){
    var a1=out.index.items.filter(function(x){return x.code==='000001.SH'||x.code==='399001.SZ';});
    if(a1.length===2)out.index.totalAmount=Math.round(sum(a1.map(function(x){return x.amount;}))*100)/100;
  }
  if(out.index.amountDeltaPct===null&&out.index.totalAmount!==null&&out.index.prevAmount)
    out.index.amountDeltaPct=Math.round((out.index.totalAmount/out.index.prevAmount-1)*10000)/100;
  return out;
}
function buildLadder(list){
  var m={};
  list.forEach(function(it){
    var s=Number(it.streak)||1;
    (m[s]=m[s]||[]).push(it);
  });
  return Object.keys(m).map(function(k){return {streak:Number(k),items:m[k]};});
}

/* 换手结构：同样是涨停，缩量一字和高换手分歧是完全不同的东西。
   新华传媒 7 板但换手 1.34%（锁仓，开板即抛压）vs 襄阳轴承 4 板换手 19.65%（真金白银的分歧换手）。 */
function turnTag(t){
  if(!isN(t))return '';
  var v=Number(t);
  if(v>=10)return '<i class="tt tt-h" title="换手率'+v.toFixed(1)+'%：充分换手板，资金在真金白银换手接筹">换手板</i>';
  if(v<2) return '<i class="tt tt-l" title="换手率'+v.toFixed(1)+'%：缩量板，筹码锁得住但一旦开板抛压集中">缩量板</i>';
  return '';
}
function rankNum(s){var m=String(s||'').match(/^(\d+)/);return m?Number(m[1]):null;}
// 消息批注：新格式是 {t:标题, n:批注}，旧的纯字符串也认（为了兼容早期导出的复盘包）
function nnVal(v){return v==null?'':(typeof v==='string'?v:String(v.n||''));}
function nnTitle(v){return (v&&typeof v==='object'&&v.t)?String(v.t):'';}
// 失效批注没有标题时，用「域名/…/路径尾」代替，避免整行都是长 URL
function urlShort(u){
  var s=String(u||'');var m=s.match(/^https?:\/\/([^\/]+)(\/.*)?$/);
  if(!m)return s;
  var seg=(m[2]||'').split('/').filter(Boolean).pop()||'';
  return m[1]+(seg?'/…/'+seg.slice(0,36):'');
}

/* ═══════════ 情绪打分 ═══════════ */
function computeSentiment(day){
  var n=notesOf(day.date);
  var s=day.sentiment,b=day.index.breadth,parts=[];
  function push(key,label,weight,score,detail){
    if(score===null||!isFinite(score))return;
    parts.push({key:key,label:label,weight:weight,score:clamp(score,0,100),detail:detail||''});
  }
  if(isN(b.up)&&isN(b.down)&&(b.up+b.down)>0){
    var ratio=b.up/(b.up+b.down);
    push('breadth','赚钱效应',25,ratio>=0.5?50+(ratio-0.5)/0.5*50:ratio/0.5*50,
      b.up+'↑ / '+b.down+'↓'+(b.total?' / 共'+b.total:''));
  }
  if(isN(s.limitUpCount)) push('limitUp','涨停家数',15,Number(s.limitUpCount)/100*100,s.limitUpCount+' 家');
  if(isN(s.maxStreak)){
    // 「连板高度」不能只看最高板：7 板孤峰 + 5/6 板断层，空间高度是虚的。
    // 取「从首板起连续存在的层数」L，有效高度 = min(最高板, L+1)，断层越高封顶越狠。
    var H=Number(s.maxStreak),dist=s.streakDist||{},L=0;
    while(Number(dist[String(L+1)])>0)L++;
    var eff=Math.min(H,L+1);
    push('height','连板高度',15,(eff-1)/6*100,
      H+' 板 · 连续 '+L+' 层 → 有效 '+eff+' 板'+(eff<H?'（断层封顶）':''));
  }
  if(isN(s.brokenRate))   push('seal','封板质量',15,(1-Number(s.brokenRate))*100,'炸板率 '+(Number(s.brokenRate)*100).toFixed(1)+'%');
  if(s.promotion&&isN(s.promotion.overall)) push('promotion','晋级率',20,Number(s.promotion.overall)/0.6*100,(Number(s.promotion.overall)*100).toFixed(1)+'%');
  var sh=day.index.items.filter(function(x){return x.code==='000001.SH';})[0];
  if(sh&&isN(sh.pct)) push('index','指数与量能',10,(Number(sh.pct)+1)/2.5*100,'上证 '+pct(sh.pct));
  var tw=sum(parts.map(function(p){return p.weight;}));
  // 分项太少时不硬算总分：只有「指数与量能」一个分项时算出来的分数会被当成交叉验证过的情绪结论，是误导
  var raw=(tw>0&&parts.length>=3)?Math.round(sum(parts.map(function(p){return p.score*p.weight;})))/tw:null;
  var ovScore=isN(n.mood)?Number(n.mood):(isN(s.scoreOverride)?Number(s.scoreOverride):null);
  var score=ovScore!==null?Math.round(ovScore):(raw===null?null:Math.round(raw));
  var phase=n.phase||s.phaseOverride;
  if(!phase&&score!==null){
    phase=score<20?'冰点':score<40?'修复':score<60?'发酵':score<80?'高潮':'退潮';
    if(phase==='退潮'&&!(isN(s.brokenRate)&&Number(s.brokenRate)>0.35)&&score<85)phase='高潮';
  }
  return {score:score,raw:raw,parts:parts,phase:phase||null,weight:tw,covered:parts.length};
}

/* ═══════════ 数据加载 ═══════════ */
function bust(src){
  // 给 data/*.js 加时间戳，绕开 GitHub Pages 的 Cache-Control: max-age=600。
  // 否则「刚跑完自动更新就刷新页面」可能仍拿到最多 10 分钟前的旧清单/旧数据，
  // 看起来像是当天没更新。file:// 下不加（fetch/script 的查询串在本地无意义且可能出问题）。
  if(location.protocol==='file:')return src;
  return src+(src.indexOf('?')<0?'?':'&')+'_='+Date.now()+Math.random().toString(36).slice(2,6);
}
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');s.src=bust(src);s.async=false;
    s.onload=function(){res();};s.onerror=function(){rej(new Error(src));};
    document.head.appendChild(s);
  });
}
// data/manifest.js 是用静态 <script> 引入的，会吃 HTTP 缓存（甚至可能缓存到根本没有新交易日）。
// 这里再 fetch 一次带时间戳的，保证刷新即见最新的交易日清单。
async function freshManifest(){
  try{
    var r=await fetch(bust('data/manifest.js'),{cache:'no-store'});
    if(!r.ok)return null;
    var t=await r.text();
    var i=t.indexOf('window.RV_MANIFEST');
    if(i<0)return null;
    var a=t.indexOf('[',i),b=t.lastIndexOf(']');
    if(a<0||b<a)return null;
    var arr=JSON.parse(t.slice(a,b+1));
    var hs=t.match(/window\.RV_HISTORY_SRC\s*=\s*"([^"]+)"/);
    if(hs)window.RV_HISTORY_SRC=hs[1];
    return (Array.isArray(arr)&&arr.length)?arr:null;
  }catch(e){return null;}   // file:// 或离线时静默回退到静态 manifest / 内嵌种子
}
function manifestEntryFromDay(day,seed){
  return {date:day.date,js:null,json:null,label:day.date,limitUp:day.sentiment.limitUpCount,
    totalAmount:day.index.totalAmount,generatedAt:day.generatedAt,seed:!!seed};
}
async function boot(){
  // 0) 网页底色（先于一切渲染，避免闪一下默认色）
  applyTheme(lsGet(THEME_KEY,'dark'));
  var tbar=document.getElementById('themeBar');
  if(tbar && !tbar._bound){
    tbar._bound=true;
    tbar.addEventListener('click',function(e){
      var el=e.target;
      while(el && el!==tbar && !(el.getAttribute && el.getAttribute('data-theme'))) el=el.parentNode;
      if(el && el.getAttribute && el.getAttribute('data-theme')) applyTheme(el.getAttribute('data-theme'));
    });
  }

  // 1) 内嵌种子
  var seed=null;
  try{
    var txt=$('#rv-seed').textContent.trim();
    if(txt&&txt.charAt(0)==='{'){seed=JSON.parse(txt);seed._seed=true;}
  }catch(e){console.warn('seed parse failed',e);}
  if(seed){RV.days[seed.date]=normDay(seed);RV.origin='内嵌种子数据';}

  // 2) data/manifest.js + 逐日数据 + 复盘文件
  var mf=(await freshManifest())||window.RV_MANIFEST;
  if(Array.isArray(mf)&&mf.length){
    RV.manifest=mf.slice().sort(function(a,b){return String(a.date)<String(b.date)?-1:1;});
    var ok=0,rvok=0;
    for(var i=0;i<RV.manifest.length;i++){
      var m=RV.manifest[i];
      try{
        await loadScript(m.js||('data/'+m.date+'.js'));
        var d=window.RV_DAY;delete window.RV_DAY;
        if(d&&d.date){RV.days[d.date]=normDay(d);ok++;}
        else if(d){RV.days[m.date]=normDay(Object.assign({date:m.date},d));ok++;}
      }catch(e){console.warn('load failed',m.date,e);}
      // 复盘层：data/<date>.review.js —— 与机器取数的数据层分开存放，双保险
      if(m.review){
        try{
          await loadScript(m.review);
          var r=window.RV_REVIEW;delete window.RV_REVIEW;
          if(r&&typeof r==='object'){RV.reviewFiles[m.date]=r;rvok++;}
        }catch(e){console.warn('review load failed',m.date,e);}
      }
    }
    if(ok>0){RV.origin='data/ 目录 · '+ok+' 个交易日';}
    else if(seed){RV.origin='内嵌种子数据（data/ 无可用数据）';}
    seedReviews(false);
    if(rvok)RV.origin+=' · 复盘 '+rvok+' 天';
  }
  // 多日趋势：data/history.js 由 tools/fetch-history.cjs 生成，manifest 里带 history 指针
  var hsrc=(mf&&mf.history)||window.RV_HISTORY_SRC||null;
  if(hsrc){
    try{
      await loadScript(hsrc);
      var hh=window.RV_HISTORY;delete window.RV_HISTORY;
      if(hh&&hh.days&&hh.days.length)RV.history=hh;
    }catch(e){console.warn('history load failed',e);}
  }
  // 离线兜底：内嵌历史种子（只拷走单个 HTML、没有 data/ 目录时用）
  if(!RV.history){
    try{
      var hx=$('#rv-histseed'),htxt=hx?hx.textContent.trim():'';
      if(htxt&&htxt.charAt(0)==='{'){RV.history=JSON.parse(htxt);}
    }catch(e){console.warn('hist seed parse failed',e);}
  }
  RV.order=Object.keys(RV.days).sort();
  if(!RV.order.length){renderEmpty();return;}
  RV.date=RV.order[RV.order.length-1];
  bind();
  render();
}

function gaugeSVG(score,color){
  var W=260,H=142,cx=130,cy=126,r=94;
  var len=Math.PI*r;
  var frac=score===null?0:clamp(score,0,100)/100;
  var x0=cx-r,y0=cy,x1=cx+r,y1=cy;
  var ang=Math.PI+frac*Math.PI;
  var nx=cx+(r-26)*Math.cos(ang),ny=cy+(r-26)*Math.sin(ang);
  var ticks='';
  for(var i=0;i<=5;i++){
    var a=Math.PI+(i/5)*Math.PI;
    var tx1=cx+(r+5)*Math.cos(a),ty1=cy+(r+5)*Math.sin(a);
    var tx2=cx+(r+11)*Math.cos(a),ty2=cy+(r+11)*Math.sin(a);
    var lx=cx+(r+20)*Math.cos(a),ly=cy+(r+20)*Math.sin(a);
    ticks+='<line x1="'+tx1.toFixed(1)+'" y1="'+ty1.toFixed(1)+'" x2="'+tx2.toFixed(1)+'" y2="'+ty2.toFixed(1)+'" style="stroke:var(--chartLine)" stroke-width="1.5"/>'
      +'<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" style="fill:var(--chartTxt)" font-size="8.5" text-anchor="middle" font-family="monospace">'+(i*20)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:260px">'
    +'<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">'
    +'<stop offset="0%" stop-color="#4c8dff"/><stop offset="30%" stop-color="#22c1c3"/>'
    +'<stop offset="55%" stop-color="#e8a33d"/><stop offset="78%" stop-color="#f2464a"/>'
    +'<stop offset="100%" stop-color="#9b6bff"/></linearGradient></defs>'
    +'<path d="M '+x0+' '+y0+' A '+r+' '+r+' 0 0 1 '+x1+' '+y1+'" fill="none" style="stroke:var(--panel3)" stroke-width="15" stroke-linecap="round"/>'
    +'<path d="M '+x0+' '+y0+' A '+r+' '+r+' 0 0 1 '+x1+' '+y1+'" fill="none" stroke="url(#gg)" stroke-width="15" stroke-linecap="round"'
    +' stroke-dasharray="'+(len*frac).toFixed(1)+' '+len.toFixed(1)+'" opacity="'+(score===null?0.15:0.95)+'"/>'
    +ticks
    +(score===null?'':'<line x1="'+cx+'" y1="'+cy+'" x2="'+nx.toFixed(1)+'" y2="'+ny.toFixed(1)+'" style="stroke:'+color+'" stroke-width="2.5" stroke-linecap="round"/>')
    +'<circle cx="'+cx+'" cy="'+cy+'" r="5" style="fill:var(--panel);stroke:'+color+'" stroke-width="2"/>'
    +'</svg>';
}

  html+=rowBar('上涨家数',b.up,b.up==null?'—':(b.up+' 家'),upPct||0,'#f2464a',
    total?('全市场 '+total+' 家'):'');
  html+=rowBar('下跌家数',b.down,b.down==null?'—':(b.down+' 家'),total&&isN(b.down)?b.down/total*100:0,'#12b57f','');

    d.sentiment.limitUpCount!=null?clamp(d.sentiment.limitUpCount/120*100,1,100):0,'#e8a33d','');

      +'<div style="width:'+(upPct||0).toFixed(1)+'%;background:linear-gradient(180deg,#f2464a,#b5363a);display:grid;place-items:center;font-size:10px;color:#fff">上涨 '+(b.up||0)+'</div>'
      +'<div style="flex:1;background:linear-gradient(180deg,#12b57f,#0d8a60);display:grid;place-items:center;font-size:10px;color:#fff">下跌 '+(b.down||0)+'</div>'
      +(isN(b.flat)&&b.flat>0?'<div style="width:6%;background:var(--segFlat);display:grid;place-items:center;font-size:9px;color:var(--segFlatTxt)">平</div>':'')
      +'</div></div>';
  }else{
    html+='<div class="empty">涨跌家数未取到 —— 该项直接影响「赚钱效应」分项（权重 25）。</div>';
  }

  $('#p-index').innerHTML=html;
}
function rowBar(label,valTxt,txt,width,color,detail){
  return '<div class="row"><div class="lbl">'+esc(label)+'</div>'
    +'<div class="bar" style="height:7px"><i style="width:'+clamp(width||0,0,100).toFixed(1)+'%;background:'+color+'"></i></div>'
    +'<div class="val">'+esc(txt)+'</div>'
    +(detail?'<div class="dt">'+esc(detail)+'</div>':'')+'</div>';
}

/* ═══════════ 模块二：竞价（9:15–9:25 集合竞价） ═══════════ */
/** 股数 → 可读。集合竞价的委买/委卖/未匹配量单位都是「股」，数值动辄上亿 */
function sharesTxt(v){
  if(!isN(v))return '—';
  v=Number(v);var a=Math.abs(v),sign=v<0?'-':'';
  if(a>=1e8)return sign+(a/1e8).toFixed(2)+'亿股';
  if(a>=1e4)return sign+(a/1e4).toFixed(1)+'万股';
  return sign+a.toFixed(0)+'股';
}
function aucSlot(x,t){var s=(x.slots||[]);for(var i=0;i<s.length;i++)if(s[i].time===t)return s[i];return null;}
function renderAuction(d){
  var a=d.auction;
  if(!a){
    $('#p-auction').innerHTML='<div class="card"><h3>集合竞价</h3>'
      +'<div class="empty">该日没有集合竞价数据。</div>'
      +'<div class="dim" style="font-size:11px;line-height:1.7">集合竞价取自 iFinD <code>search_stocks</code> 的时点快照。'
      +'若这一天是用 <code>--only</code> 增量补的、并且模块列表里没写 <code>auction</code>，或该日数据早于本功能上线，这里就会是空的。</div></div>';
    return;
  }
  var items=a.items,amtTotal=d.index.totalAmount,html='';
  var top=items[0]||{},buyB=null,sellB=null;
  items.forEach(function(x){
    var s=aucSlot(x,'09:25');if(!s||!isN(s.unmatched))return;
    var v=Number(s.unmatched);
    if(v>0&&(!buyB||v>buyB.v))buyB={x:x,v:v};
    if(v<0&&(!sellB||v<sellB.v))sellB={x:x,v:v};
  });
  html+='<div class="card"><h3>竞价概览<span class="hint">9:15 / 9:20 / 9:25 三个时点 · 取自 iFinD search_stocks</span></h3>';
  html+='<div class="stats">';
  html+='<div class="stat"><div class="k">竞价额 TOP'+a.count+' 合计</div><div class="v">'+num(a.amountSum)+'</div>'
    +'<div class="s">亿元'+(amtTotal?(' · 占两市成交 '+num(a.amountSum/amtTotal*100,2)+'%'):'')+'</div></div>';
  html+='<div class="stat"><div class="k">竞价额第一</div><div class="v">'+num(top.amount)+'</div>'
    +'<div class="s">亿元 · '+esc(top.name||'—')+(top.rank?(' · 全市场 '+top.rank+'/'+(top.rankBase||'—')):'')+'</div></div>';
  html+='<div class="stat"><div class="k">覆盖家数</div><div class="v">'+a.count+'</div>'
    +'<div class="s">全市场 '+(a.marketCount||'—')+' 只</div></div>';
  html+='<div class="stat"><div class="k">9:25 买盘剩余最多</div><div class="v up" style="font-size:13px">'
    +(buyB?esc(buyB.x.name):'—')+'</div><div class="s">'+(buyB?sharesTxt(buyB.v):'—')+'</div></div>';
  html+='<div class="stat"><div class="k">9:25 卖盘剩余最多</div><div class="v down" style="font-size:13px">'
    +(sellB?esc(sellB.x.name):'—')+'</div><div class="s">'+(sellB?sharesTxt(Math.abs(sellB.v)):'—')+'</div></div>';
  html+='</div>';
  html+='<div class="legend" style="margin:12px 0 0"><span><i style="background:var(--up)"></i>匹配价 / 未匹配量为正 = 买方剩余（封单）</span>'
    +'<span><i style="background:var(--down)"></i>未匹配量为负 = 卖方剩余</span>'
    +'<span class="dim">未匹配量 = 委买 − 已撮合，单位「股」</span></div>';
  html+='</div>';

  html+='<div class="card" style="margin-top:14px"><h3>竞价明细 · 全市场竞价金额 TOP'+a.count
    +'<span class="hint">按竞价金额降序 · 悬停看委买/委卖</span></h3><div style="overflow-x:auto"><table class="tbl"><thead><tr>';
  html+='<th>#</th><th>股票</th><th>竞价额(亿)</th><th>行业</th>';
  ['09:15','09:20','09:25'].forEach(function(t){html+='<th>'+t+'</th>';});
  html+='</tr></thead><tbody>';
  items.forEach(function(x){
    html+='<tr><td class="rkx">'+(x.rank||'—')+'</td>';
    html+='<td class="sc">'+esc(x.name)+' <span class="dim" style="font-size:10px">'+esc(x.code)+'</span></td>';
    html+='<td class="amtx">'+num(x.amount)+'</td>';
    html+='<td class="indx">'+esc(x.industry||'—')+'</td>';
    ['09:15','09:20','09:25'].forEach(function(t){
      var s=aucSlot(x,t);
      if(!s){html+='<td class="dimv">—</td>';return;}
      var pc=s.pct,um=s.unmatched;
      var pcol=pc==null?'var(--dim2)':(pc>0?'var(--up)':(pc<0?'var(--down)':'var(--dim2)'));
      var ucol=um==null?'var(--dim2)':(um>0?'var(--up)':(um<0?'var(--down)':'var(--dim2)'));
      var utxt=um==null?'—':((um>0?'买余 ':'卖余 ')+sharesTxt(Math.abs(um)));
      var tip='委买 '+(s.bid==null?'—':sharesTxt(s.bid))+' / 委卖 '+(s.ask==null?'—':sharesTxt(s.ask));
      // 主板 ±10%、双创 ±20%，虚拟匹配价不可能越过涨跌停 —— 越过就是无涨跌幅限制（新股/次新）
      var isNew=pc!=null&&Math.abs(pc)>21;
      html+='<td title="'+esc(tip+(isNew?' · 无涨跌幅限制，多为新股首日':''))+'"><div class="slot">'
        +'<span class="p" style="color:'+pcol+'">'+(pc==null?'—':pct(pc))+(isNew?'<sup class="newm">新</sup>':'')+'</span>'
        +'<span class="u" style="color:'+ucol+'">'+utxt+'</span></div></td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  html+='<div class="dim" style="font-size:11px;line-height:1.75;margin-top:10px">'
    +'<b>怎么读这三个时点</b>：9:15–9:20 可报单可撤单、9:20–9:25 可报单<b>不可撤单</b>，两段都不成交，'
    +'所有委托在 9:25 一次性撮合。所以<b>成交性质的「竞价金额」只有 9:25 一个时点</b>；'
    +'9:15 / 9:20 看到的是委托挂单与虚拟匹配结果（匹配价 = 虚拟成交价相对昨收）。'
    +'9:20 之后撤单窗口关闭，此时的匹配价与买盘剩余更能代表真实意图 —— 上面那张表里 9:15→9:20 匹配价被拉回、'
    +'买余放大的个股，就是资金在竞价阶段抢筹。</div>';
  html+='<div class="dim" style="font-size:11px;margin-top:8px">'+esc(a.note||'')+'</div>';
  html+='</div>';
  $('#p-auction').innerHTML=html;
}

/* ═══════════ 模块三：情绪 ═══════════ */
function renderSentiment(d,s){
  var sen=d.sentiment,html='<div class="grid2">';

  // 分项拆解
  html+='<div class="card"><h3>情绪分拆解 <span class="hint">'+(s.score===null?'数据不足':'合计 '+s.score+' 分')+'</span></h3>';
  if(s.parts.length){
    html+='<div class="rows">'+s.parts.map(function(p){
      var c=p.score>=75?'#f2464a':p.score>=50?'#e8a33d':p.score>=30?'#22c1c3':'#4c8dff';
      return '<div class="row"><div class="lbl">'+p.label+'<span style="color:var(--dim2)"> '+p.weight+'%</span></div>'
        +'<div class="bar" style="height:7px"><i style="width:'+p.score.toFixed(1)+'%;background:'+c+'"></i></div>'
        +'<div class="val" style="color:'+c+'">'+p.score.toFixed(0)+'</div>'
        +(p.detail?'<div class="dt">'+esc(p.detail)+'</div>':'')+'</div>';
    }).join('')+'</div>';
    var miss=[['breadth','赚钱效应'],['limitUp','涨停家数'],['height','连板高度'],['seal','封板质量'],['promotion','晋级率'],['index','指数与量能']]
      .filter(function(x){return !s.parts.some(function(p){return p.key===x[0];});});
    if(miss.length) html+='<div class="warnlist" style="margin-top:14px"><div>缺失分项（已按权重重算）：'+miss.map(function(x){return x[1];}).join('、')+'</div></div>';
    if(s.parts.length<3) html+='<div class="warnlist" style="margin-top:10px"><div style="color:var(--upSoft)">可用分项少于 3 个，<b>不计算情绪总分</b>——只靠单一分项得出的分数会被误当成结论。</div></div>';
    html+='<div style="margin-top:12px;font-size:10.5px;color:var(--dim2)">算法见 SCHEMA.md §7；人工覆写见本页「主观情绪与周期位置」。</div>';
  }else{
    html+='<div class="empty">无任何可用分项（至少需要涨停家数、连板高度、指数与量能中的 3 项才计算总分）。</div>';
  }
  html+='</div>';

  // 连板梯队分布 —— 把 1..最高板 之间空缺的层也画出来，断层要看得见
  var dist=sen.streakDist||{};
  var maxK=isN(sen.maxStreak)?Number(sen.maxStreak):0;
  var allK=[];for(var kk=1;kk<=maxK;kk++)allK.push(kk);
  var mx=1;allK.forEach(function(kk){mx=Math.max(mx,Number(dist[String(kk)]||0));});
  var gaps=allK.filter(function(kk){return !(Number(dist[String(kk)])>0);});
  html+='<div class="card"><h3>连板梯队分布 <span class="hint">最高 '+int(sen.maxStreak)+' 板'
    +(gaps.length?' · <span style="color:#e8a33d">断层 '+gaps.map(function(g){return (g===1?'首板':g+'板');}).join('、')+'</span>':'')+'</span></h3>';
  html+=maxK?('<div class="hbars">'+allK.map(function(kk){
      var v=Number(dist[String(kk)]||0);
      var t=kk===1?'首板':kk+'板';
      if(!v) return '<div class="hbar" title="'+t+' 断层：无个股"><div class="n" style="color:#e8a33d;opacity:.7">0</div>'
        +'<div class="b" style="height:4px;background:repeating-linear-gradient(90deg,#e8a33d 0 2px,transparent 2px 5px);opacity:.5"></div>'
        +'<div class="t" style="color:#e8a33d">'+t+'</div></div>';
      var c=kk>=5?'#f2464a':kk>=3?'#e8a33d':kk===2?'#22c1c3':'#4c8dff';
      return '<div class="hbar" title="'+t+' '+v+' 只"><div class="n" style="color:'+c+'">'+v+'</div>'
        +'<div class="b" style="height:'+Math.max(4,v/mx*88)+'px;background:linear-gradient(180deg,'+c+',rgba(0,0,0,.5))"></div>'
        +'<div class="t">'+t+'</div></div>';
    }).join('')+'</div>'):'<div class="empty">梯队数据缺失</div>';
  if(gaps.length) html+='<div class="warnlist" style="margin-top:12px"><div>第 '
    +gaps.join('、')+' 板<span class="dim"> 完全空缺</span> —— 高度由孤峰个股撑起，不是梯队推上来的，'
    +'「连板高度」分项已按连续层数封顶。</div></div>';
  html+='<div class="rows mt14">';
  html+='<div class="row"><div class="lbl">涨停家数</div><div class="bar" style="height:7px"><i style="width:'+clamp((sen.limitUpCount||0)/120*100,0,100).toFixed(1)+'%;background:#f2464a"></i></div><div class="val">'+int(sen.limitUpCount)+'</div></div>';
  html+='<div class="row"><div class="lbl">跌停家数</div><div class="bar" style="height:7px"><i style="width:'+clamp((sen.limitDownCount||0)/60*100,0,100).toFixed(1)+'%;background:#12b57f"></i></div><div class="val">'+int(sen.limitDownCount)+'</div></div>';
  html+='<div class="row"><div class="lbl">炸板家数</div><div class="bar" style="height:7px"><i style="width:'+(sen.brokenRate!=null?clamp(Number(sen.brokenRate)*100,0,100).toFixed(1):0)+'%;background:#9b6bff"></i></div><div class="val">'+int(sen.brokenCount)+'</div></div>';
  html+='<div class="row"><div class="lbl">昨日涨停→今日跌停<span class="dim"> 核按钮</span></div><div class="bar" style="height:7px"><i style="width:'+clamp((sen.killCount||0)/20*100,0,100).toFixed(1)+'%;background:#ff5c8a"></i></div><div class="val" style="color:'+(sen.killCount>=5?'#ff5c8a':'var(--txt2)')+'">'+int(sen.killCount)+'</div></div>';
  html+='</div>';
  html+='</div>';   // 关「连板梯队分布」卡（否则后面的卡会嵌在它里面）

  // 晋级率
  var pr=sen.promotion||{};
  html+='<div class="card"><h3>晋级率 / 接力强度</h3><div class="rows">';
  [['1to2','首板 → 2板'],['2to3','2板 → 3板'],['3to4','3板 → 4板'],['overall','昨日涨停 → 今日连板']].forEach(function(x){
    var v=pr[x[0]];
    var p=v==null?0:clamp(Number(v)*100,0,100);
    html+='<div class="row"><div class="lbl">'+x[1]+'</div>'
      +'<div class="bar" style="height:7px"><i style="width:'+p.toFixed(1)+'%;background:'+(p>=40?'#f2464a':p>=25?'#e8a33d':'#22c1c3')+'"></i></div>'
      +'<div class="val">'+(v==null?'—':p.toFixed(1)+'%')+'</div></div>';
  });
  html+='</div>';
  if(sen.prevLimitUpCount!=null||sen.limitUpCount!=null){
    html+='<div style="margin-top:12px;font-size:11px;color:var(--dim)">昨日涨停 '+int(sen.prevLimitUpCount)+' 家 → 今日涨停 '+int(sen.limitUpCount)+' 家'
      +(sen.prevLimitUpCount&&sen.limitUpCount!=null?('，家数变化 '+(sen.limitUpCount-sen.prevLimitUpCount>0?'+':'')+(sen.limitUpCount-sen.prevLimitUpCount)):'')+'</div>';
  }
  html+='</div>';

  // 数据体检
  var missing=collectMissing(d);
  html+='<div class="card"><h3>数据体检 <span class="hint">'+missing.length+' 项待补齐</span></h3>';
  html+=missing.length?('<div class="missing">'+missing.map(function(m){return '<span>'+esc(m)+'</span>';}).join('')+'</div>'):'<div class="empty">核心字段齐全</div>';
  if(d.warnings&&d.warnings.length){
    html+='<div class="warnlist mt14">'+d.warnings.map(function(w){return '<div>'+esc(w)+'</div>';}).join('')+'</div>';
  }
  html+='</div>';

  // 主观情绪与周期位置（人工覆写自动计算）
  var n=notesOf(d.date);
  html+='<div class="card"><h3>主观情绪与周期位置 <span class="hint">人工覆写自动计算</span></h3>'
    +'<div class="sw"><input type="range" id="mood" min="0" max="100" value="'+(n.mood!=null?n.mood:(s.score||50))+'">'
    +'<b class="num" id="moodV" style="width:34px;text-align:right">'+(n.mood!=null?n.mood:(s.score==null?'—':s.score))+'</b></div>'
    +'<div style="display:flex;gap:6px;align-items:center;margin-top:4px">'
    +'<span style="font-size:10.5px;color:var(--dim2)">'+(n.mood!=null?'已使用人工打分，自动情绪分 '+(s.raw==null?'—':s.raw.toFixed(1))+' 被覆写':'拖动即覆写自动计算的 '+(s.raw==null?'—':s.raw.toFixed(1))+' 分')+'</span>'
    +'<button id="moodClear" style="margin-left:auto;padding:2px 9px;font-size:10.5px">还原自动</button></div>'
    +'<div class="lbl2 mt14">情绪周期阶段</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +PHASES.map(function(p){return '<button data-phase="'+p+'" style="'+(n.phase===p?'background:'+PHASE_COLOR[p]+';color:var(--onAccent);border-color:transparent':'')+'">'+p+'</button>';}).join('')
    +'<button data-phase="" style="'+(n.phase?'':'background:var(--panel3);color:var(--txt)')+'">自动</button></div>'
    +'<div style="font-size:10.5px;color:var(--dim2);margin-top:10px">自动判定：<b>'+(s.phase||'数据不足')+'</b>'
    +(s.score!=null?('（情绪分 '+s.score+'）'):'')+'　人工覆写：<b>'+(n.phase||'未设置')+'</b></div>'
    +'</div>';

  html+='</div>';   // 关 grid2
  $('#p-sentiment').innerHTML=html;
  bindMoodPhase(d,s);
}
function bindMoodPhase(d,s){
  var mood=$('#mood');
  if(mood){
    mood.addEventListener('input',function(){
      var v=Number(mood.value);
      notesOf(d.date).mood=v;$('#moodV').textContent=v;saveNotes();
      var dd=cur(),ss=computeSentiment(dd);
      renderOverview(dd,ss);renderKpis(dd,ss);
    });
    mood.addEventListener('change',function(){render();});
  }
  var mc=$('#moodClear');
  if(mc)mc.addEventListener('click',function(){notesOf(d.date).mood=null;saveNotes();render();});
  $$('#p-sentiment [data-phase]').forEach(function(b){
    b.addEventListener('click',function(){notesOf(d.date).phase=b.dataset.phase||null;saveNotes();render();});
  });
}
function collectMissing(d){
  var out=[],b=d.index.breadth,s=d.sentiment;
  function chk(v,label){if(v===null||v===undefined||v==='')out.push(label);}
  chk(b.up,'指数.涨跌家数.上涨');chk(b.down,'指数.涨跌家数.下跌');
  chk(d.index.prevAmount,'指数.上一日成交额');
  chk(s.limitDownCount,'情绪.跌停家数');chk(s.brokenCount,'情绪.炸板家数');chk(s.brokenRate,'情绪.炸板率');
  chk(s.promotion.overall,'情绪.晋级率');
  var withPct=d.themes.filter(function(t){return isN(t.pct);});
  if(d.themes.length&&!withPct.length)out.push('题材.板块涨跌幅');
  if(!d.stocks.ladder.length)out.push('个股.涨停梯队');
  if(!d.auction)out.push('竞价.集合竞价');
  if(!d.picks)out.push('选股.规则筛选');
  if(!d.news.items.length&&!d.news.manual.length)out.push('消息面.资讯');
  return out;
}

/* ═══════════ 模块三：题材 ═══════════ */
function renderTheme(d){
  var nt=notesOf(d.date).themeNote;
  var list=d.themes.slice().sort(function(a,b){
    return (Number(b.limitUpCount)||0)-(Number(a.limitUpCount)||0)||(Number(b.amount)||0)-(Number(a.amount)||0);
  });
  // 板块涨幅榜：与涨停股无关，search_stocks 配额受限的日子里这是题材页唯一的信息来源
  var sec=(d.sectors||[]).slice().sort(function(a,b){
    return (Number(b.pct)||0)-(Number(a.pct)||0);
  });
  var html='';
  if(!list.length&&!sec.length){$('#p-theme').innerHTML='<div class="card"><div class="empty">题材数据缺失</div></div>';return;}

  if(!list.length){

  html+=list.map(function(t,i){
    var n=Number(t.limitUpCount)||0,p=isN(t.pct)?Number(t.pct):null;
    return '<tr><td class="rank">'+(i+1)+'</td>'
      +'<td><b>'+esc(t.name)+'</b></td>'
      +'<td class="r num up">'+n+'</td>'
      +'<td><div class="bar"><i style="width:'+(n/mx*100).toFixed(1)+'%;background:linear-gradient(90deg,#f2464a,#e8a33d)"></i></div></td>'
      +'<td class="r num">'+(isN(t.maxStreak)?t.maxStreak+' 板':'—')+'</td>'
      +'<td class="r num">'+num(t.amount)+'</td>'
      +'<td class="r num '+cls(p)+'">'+(p==null?'—':pct(p))+'</td>'
      +'<td class="dim" style="white-space:normal;max-width:280px">'+esc((t.leaders||[]).join(' · '))+'</td></tr>';
  }).join('');
  html+='</tbody></table></div>';
  }

  if(sec.length){
    var smx=Math.max(0.5,Math.max.apply(null,sec.map(function(x){return Math.abs(Number(x.pct)||0);})));
    var hasUp=list.length?list[0].name:null;
    html+='<div class="card'+(list.length?' mt14':'')+'"><h3>板块涨幅榜 · 申万一级 <span class="hint">共 '+sec.length+' 个行业 · 红涨绿跌 · 取自 sector_data，不受 search_stocks 配额影响</span></h3>';
    html+='<div class="secgrid" style="grid-template-rows:repeat('+Math.ceil(sec.length/2)+',auto)">';
    html+=sec.map(function(x){
      var p=Number(x.pct)||0,w=Math.abs(p)/smx*50;
      var lead=(list.length&&x.name===hasUp)?'<em class="slead">涨停最多</em>':'';
      return '<div class="srow"><span class="snm">'+esc(x.name)+lead+'</span>'
        +'<span class="sbar"><i class="'+(p>=0?'p':'n')+'" style="'+(p>=0?'left:50%':'right:50%')+';width:'+w.toFixed(1)+'%"></i></span>'
        +'<span class="spc num '+cls(p)+'">'+pct(p)+'</span></div>';
    }).join('');
    html+='</div></div>';

  if(list.length){
  html+='<div class="grid2 mt14">';
  html+='<div class="card"><h3>题材备注 <span class="hint">自动保存到本地</span></h3><div class="rows">';
  html+=list.slice(0,12).map(function(t){
    return '<div style="display:grid;grid-template-columns:88px 1fr;gap:9px;align-items:center">'
      +'<div style="font-size:11.5px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.name)+'</div>'

  html+='<div class="card"><h3>题材梯队 <span class="hint">涨停股按题材归堆</span></h3><div class="rows">';
  html+=list.slice(0,10).map(function(t){
    var names=[];
    d.stocks.ladder.forEach(function(g){
      g.items.forEach(function(x){if((x.theme||x.industry)===t.name)names.push(x.name+(Number(x.streak)>1?'('+x.streak+'板)':''));});
    });
    return '<div style="font-size:11.5px"><span class="tag" style="border-color:rgba(242,70,74,.4);color:var(--upSoft)">'+esc(t.name)+' '+n0(t.limitUpCount)+'</span> '
      +'<span class="dim" style="margin-left:6px">'+esc(names.join('、')||'—')+'</span></div>';

function n0(v){return isN(v)?String(v):'—';}

/* ═══════════ 模块四：个股 ═══════════ */
/** 档内排序：最后涨停时间早的在前（越早封板越强）；没有时间的排最后 */
function byLastTime(a,b){
  var ta=a.lastTime||'99:99', tb=b.lastTime||'99:99';
  return ta<tb?-1:ta>tb?1:0;
}
function renderStock(d){
  var ui=RV.ui,html='';
  html+='<div style="display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap">'
    +'<button data-sv="ladder" class="'+(ui.stockView==='ladder'?'on':'')+'" style="'+(ui.stockView==='ladder'?'background:var(--up-bg);border-color:rgba(242,70,74,.45);color:var(--upSoft)':'')+'">涨停天梯</button>'
    +'<button data-sv="table" class="'+(ui.stockView==='table'?'on':'')+'" style="'+(ui.stockView==='table'?'background:var(--up-bg);border-color:rgba(242,70,74,.45);color:var(--upSoft)':'')+'">涨停明细表</button>'
    +'<span style="font-size:11px;color:var(--dim);margin-left:6px">共 '+int(d.sentiment.limitUpCount)+' 只涨停 · 最高 '+int(d.sentiment.maxStreak)+' 板</span>'
    +'<input id="stkSearch" placeholder="搜索代码/名称/行业" style="margin-left:auto;width:190px" value="'+esc(ui.stkQ||'')+'">'
    +'</div>';

  if(!d.stocks.ladder.length){
    html+='<div class="card"><div class="empty">涨停梯队数据缺失 —— 运行取数脚本后此处会显示按板高分组的个股卡片墙。</div></div>';
    $('#p-stock').innerHTML=html;bindStock();return;
  }
  var q=(ui.stkQ||'').trim().toLowerCase();
  var match=function(x){
    if(!q)return true;
    return String(x.name||'').toLowerCase().indexOf(q)>=0||String(x.code||'').toLowerCase().indexOf(q)>=0
      ||String(x.industry||'').toLowerCase().indexOf(q)>=0;
  };
  var ladder=d.stocks.ladder.map(function(g){return {streak:g.streak,items:g.items.filter(match).sort(byLastTime)};}).filter(function(g){return g.items.length;});

  if(ui.stockView==='ladder'){
    html+=themeTiles(d);
    html+='<div class="card"><h3>涨停天梯 <span class="hint">最高板在最上面 · 每行按最后涨停时间从早到晚排（越早封板越强）· 每格左上是最后涨停时间、右上是成交额 · 悬停看首封/开板/换手/排名</span>'
      +'<span class="hint" style="margin-left:auto">'+int(d.sentiment.limitUpCount)+' 只 · 最高 '+int(d.sentiment.maxStreak)+' 板</span></h3><div class="lt">';
    ladder.forEach(function(g,gi){
      var isTop=gi===0,c=streakColor(g.streak);
      var rail=isTop?'打开高度':(Number(g.streak)===1?'首板':g.streak+'板');
      html+='<div class="lt-row"><div class="lt-rail'+(isTop?' top':'')+'">'+rail+'</div><div class="lt-grid">';
      g.items.forEach(function(x){
        var rk=rankNum(x.amountRank);
        var oneWord=(x.firstTime==='09:30'&&x.lastTime==='09:30'&&!Number(x.openTimes))?1:0;
        var tip=x.name+' '+x.code+'\n'+(x.industryFull||x.industry||'—')
          +'\n最后涨停 '+(x.lastTime||'—')+(x.firstTime?'（首封 '+x.firstTime+'）':'')
          +(x.openTimes!=null?' · 开板 '+x.openTimes+' 次':'')
          +(oneWord?'\n一字板（开盘即涨停，全天未开板）':'')
          +'\n成交额 '+num(x.amount,2)+' 亿 · 换手 '+num(x.turnover,2)+'%'
          +(x.amountRank?'\n全市场成交额排名 '+x.amountRank:'');
        html+='<div class="chip" title="'+esc(tip)+'">'
          +'<div class="lt-top">'+(isTop?'<span class="lt-str">'+int(g.streak)+'连板</span>':'')
          +'<span class="lt-time'+(oneWord?' one':'')+'">'+esc(x.lastTime||'—')+'</span>'
          +'<span class="lt-amt'+(rk&&rk<=500?' hi':'')+'">'+num(x.amount,1)+'亿</span></div>'
          +'<b>'+esc(x.name)+'</b>'
          +'<div class="lt-tag" style="color:'+c+'">'+esc(x.industry||x.theme||'—')+turnTag(x.turnover)+'</div>'
          +'</div>';
      });
      var pad=(4-(g.items.length%4))%4;
      for(var i=0;i<pad;i++)html+='<div class="chip-empty"></div>';
      html+='</div></div>';
    });
    html+='</div></div>';
  }else{
    var flat=[];
    d.stocks.ladder.forEach(function(g){g.items.forEach(function(x){flat.push(Object.assign({streak:g.streak},x));});});
    if(q)flat=flat.filter(match);
    var k=ui.sortKey,dir=ui.sortDir;
    flat.sort(function(a,b){
      if(k==='name')return String(a.name).localeCompare(String(b.name),'zh')*dir;
      var av=Number(a[k]),bv=Number(b[k]);
      if(!isFinite(av))av=-1;if(!isFinite(bv))bv=-1;
      return (av-bv)*dir;
    });
    html+='<div class="card"><table><thead><tr>'
      +sorth('name','名称',ui)+sorth('streak','板高',ui,'r')+sorth('amount','成交额(亿)',ui,'r')
      +'<th class="r">涨停时间</th>'
      +sorth('turnover','换手率',ui,'r')+'<th>行业</th><th class="r">成交额排名</th></tr></thead><tbody>';
    html+=flat.map(function(x){
      return '<tr><td><b>'+esc(x.name)+'</b> <span class="code">'+esc(x.code)+'</span></td>'
        +'<td class="r num '+(Number(x.streak)>=3?'up':'')+'">'+(Number(x.streak)>1?x.streak+' 板':'首板')+'</td>'
        +'<td class="r num">'+num(x.amount,2)+'</td>'
        +'<td class="r num" title="首封 '+esc(x.firstTime||'—')+' · 开板 '+(x.openTimes==null?'—':x.openTimes)+' 次">'
        +(x.lastTime?esc(x.firstTime&&x.firstTime!==x.lastTime?x.firstTime+'→'+x.lastTime:x.lastTime):'—')+'</td>'
        +'<td class="r num">'+num(x.turnover,2)+'%</td>'
        +'<td class="dim">'+esc(x.industry||'—')+'</td>'
        +'<td class="r rank">'+esc(x.amountRank||'—')+'</td></tr>';
    }).join('');
    html+='</tbody></table></div>';
  }

  $('#p-stock').innerHTML=html;
  bindStock();
}
function streakColor(s){s=Number(s)||1;return s>=5?'#f2464a':s>=3?'#e8a33d':s===2?'#22c1c3':'#4c8dff';}
/* 题材概览：把涨停股按申万行业归堆，前 6 个单列，其余并成「其他」（照天梯图的首屏样式） */
function themeTiles(d){
  var ts=(d.themes||[]).filter(function(t){return Number(t.limitUpCount)>0;})
    .sort(function(a,b){return (Number(b.limitUpCount)||0)-(Number(a.limitUpCount)||0)||(Number(b.amount)||0)-(Number(a.amount)||0);});
  if(!ts.length)return '';
  var head=ts.slice(0,6),rest=ts.slice(6);
  function tile(name,cnt,amount,pct){
    var col=isN(pct)?(Number(pct)>0?'#f2464a':(Number(pct)<0?'#12b57f':'var(--txt)')):'var(--txt)';
    return '<div class="tile"><div class="tn" style="color:'+col+'">'+esc(name)
      +'<em>('+int(cnt)+')</em></div><div class="ta">成交额 '+num(amount,1)+'亿</div></div>';
  }
  var html='<div class="card"><h3>题材概览 <span class="hint">按申万行业归堆 · 括号里是涨停家数 · 成交额是板块内涨停股合计</span></h3><div class="tiles">';
  head.forEach(function(t){html+=tile(t.name,t.limitUpCount,t.amount,t.pct);});
  if(rest.length){
    var n=0,am=0;
    rest.forEach(function(t){n+=Number(t.limitUpCount)||0;am+=Number(t.amount)||0;});
    html+=tile('其他',n,am,null);
  }
  return html+'</div></div>';
}
function sorth(key,label,ui,al){
  var on=ui.sortKey===key;
  return '<th class="s '+(al||'')+'" data-k="'+key+'" style="'+(on?'color:var(--upSoft)':'')+'">'+label
    +(on?(ui.sortDir>0?' ▲':' ▼'):'')+'</th>';
}
function bindStock(){
  $$('#p-stock [data-sv]').forEach(function(b){
    b.addEventListener('click',function(){RV.ui.stockView=b.dataset.sv;saveUI();renderStock(cur());});
  });
  $$('#p-stock th.s').forEach(function(th){
    th.addEventListener('click',function(){
      var k=th.dataset.k;
      if(RV.ui.sortKey===k)RV.ui.sortDir=-RV.ui.sortDir;else{RV.ui.sortKey=k;RV.ui.sortDir=-1;}
      saveUI();renderStock(cur());
    });
  });
  var si=$('#stkSearch');
  if(si){
    si.addEventListener('input',function(){
      RV.ui.stkQ=si.value;
      var pos=si.selectionStart;saveUI();renderStock(cur());
      var s2=$('#stkSearch');if(s2){s2.focus();try{s2.setSelectionRange(pos,pos);}catch(e){}}
    });
  }
}

/* ═══════════ 模块六：消息面 ═══════════ */

  var manual=d.news.manual.map(function(x){return Object.assign({_src:'manual'},x);});

  html+='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'

    +'<input id="nwSrc" placeholder="来源" style="width:110px">'

  if(shown.length){
    html+='<div class="newslist">'+shown.map(function(x,i){
      var idx=all.indexOf(x),key=x.url||x.title||String(idx);

        +'<b style="color:'+heatColor+'">'+heatTxt+'</b>'
        +(heat==null?'':'<i><em style="width:'+clamp(heat/mx*100,4,100).toFixed(0)+'%"></em></i>')+'</div>'
        +'<div><a class="ti" href="'+esc(x.url||'#')+'" target="_blank" rel="noopener">'+esc(x.title||'(无标题)')+'</a>'
        +(x.summary?'<div class="nsum" data-nsum="'+idx+'" title="点击展开 / 收起全文">'+esc(x.summary)+'</div>':'')
        +'<div class="mt"><span class="tag">'+esc(x.tag||'其他')+'</span>'
        +'<span>'+esc(x.source||'—')+'</span>'
        +(x.time?'<span>'+esc(String(x.time).slice(0,16))+'</span>':'')
        +(x._src==='user'?'<span style="color:var(--gold)">手工</span>':'')
        +'<button class="mini" data-del="'+idx+'" style="padding:0 7px;font-size:10px">删</button></div>'
        +'<input class="nnote" data-nk="'+esc(key)+'" data-nt="'+esc(x.title||'')+'" value="'+esc(nnVal(notes[key]))+'" placeholder="影响判断 / 对应题材" style="margin-top:5px;width:100%">'
        +'</div></div>';
    }).join('')+'</div>';
  }else{

  }

  // 失效批注：iFinD 每次调用返回的是当天资讯的一个**抽样**，样本会变（已改用并集刷新缓解，但仍可能有条目掉出）。
  // 掉出列表的条目其批注不该跟着消失，否则等于悄悄丢用户写的东西 —— 单独兜底列出来。
  var live={};all.forEach(function(x,i){live[x.url||x.title||String(i)]=1;});

          +'<input class="nnote" data-orphnk="'+esc(k)+'" value="'+esc(nnVal(raw))+'" style="margin-top:5px;width:100%">'
          +'</div></div>';
      }).join('')+'</div></div>';
  }
  html+='</div>';
  $('#p-news').innerHTML=html;

  $$('#p-news [data-tag]').forEach(function(b){
    b.addEventListener('click',function(){RV.ui.newsTag=b.dataset.tag;saveUI();renderNews(cur());});

  $$('#p-news [data-nsum]').forEach(function(el){

  $$('#p-news .nnote').forEach(function(inp){
    inp.addEventListener('input',function(){
      var n=notesOf(RV.date).newsNote;

  $$('#p-news [data-orphdel]').forEach(function(b){
    b.addEventListener('click',function(){

  $$('#p-news [data-del]').forEach(function(b){
    b.addEventListener('click',function(){
      var x=all[Number(b.dataset.del)];
      if(!x)return;

      saveNotes();renderNews(cur());

  });
  var btn=$('#nwAdd');
  if(btn)btn.addEventListener('click',function(){
    var t=$('#nwTitle').value.trim();if(!t){toast('请填写标题');return;}
    notesOf(RV.date).newsAdd.push({title:t,source:$('#nwSrc').value.trim()||'手工',tag:$('#nwTag').value,time:new Date().toISOString().slice(0,16).replace('T',' '),heat:null,url:''});
    saveNotes();renderNews(cur());
