}

/* ═══════════ 模块六：多日大盘趋势 ═══════════
   数据来源：data/history.js（window.RV_HISTORY，由 tools/fetch-history.cjs 生成）
             + data/<date>.json（本地的涨停家数/情绪分，只有取过数的日子才有）。
   注意：历史序列里的「休市日」已在落盘时按「涨跌幅为空」过滤掉，这里拿到的都是真交易日。 */
function fmtMD(ds){var p=String(ds).split('-');return p[1]+'-'+p[2];}
/** n 日简单移动平均，数据不足处为 null */
function ma(vals,n){
  var out=[];
  for(var i=0;i<vals.length;i++){
    if(i<n-1){out.push(null);continue;}
    var sum=0,bad=false;
    for(var j=i-n+1;j<=i;j++){if(!isN(vals[j])){bad=true;break;}sum+=Number(vals[j]);}
    out.push(bad?null:sum/n);
  }
  return out;
}
function pathOf(vals,X,Y){
  var d='',pen=false;
  vals.forEach(function(v,i){
    if(!isN(v)){pen=false;return;}
    d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(Number(v)).toFixed(1)+' ';
    pen=true;
  });
  return d;
}
/** 取一个「好看」的刻度步长（1/2/2.5/5/10 × 10^n），让 Y 轴刻度落在整数上 */
function niceStep(raw){
  if(!(raw>0))return 1;
  var e=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),f=raw/e;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;
}
function legendOf(items){
  return '<div class="legend">'+items.map(function(s){
    return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>';
  }).join('')+'</div>';
}
/**
 * 通用图表。cats=横轴标签；series=[{name,color,vals,type:'bar'|'line',dash,op,w}]
 * opt: {w,h,pl,pt,pb,dp,yfmt,zero,tip}
 */
function mkChart(cats,series,opt){
  opt=opt||{};
  var w=opt.w||980,h=opt.h||200,pl=opt.pl||54,pr=16,pt=opt.pt||14,pb=opt.pb||26;
  var iw=w-pl-pr,ih=h-pt-pb,n=cats.length;
  var all=[];
  series.forEach(function(s){s.vals.forEach(function(v){if(isN(v))all.push(Number(v));});});
  if(!n||!all.length)return '<div class="empty">无数据</div>';
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(opt.zero!==false){lo=Math.min(lo,0);hi=Math.max(hi,0);}
  var stp=niceStep(((hi-lo)||Math.abs(hi)||1)/4);
  lo=Math.floor(lo/stp)*stp;hi=Math.ceil(hi/stp)*stp;
  if(hi<=lo)hi=lo+stp;
  var sp=hi-lo;
  var ticks=Math.max(2,Math.min(6,Math.round(sp/stp)));
  var slot=iw/n;
  var X=function(i){return pl+slot*(i+0.5);};
  var Y=function(v){return pt+ih-(v-lo)/sp*ih;};
  var dp=opt.dp==null?0:opt.dp;
  var yf=opt.yfmt||function(v){return v.toFixed(dp);};
  var o='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
  for(var g=0;g<=ticks;g++){
    var gv=lo+sp*g/ticks,gy=Y(gv);
    o+='<line class="grid" x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(pl+iw)+'" y2="'+gy.toFixed(1)+'"/>';
    o+='<text x="'+(pl-7)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end">'+esc(yf(gv))+'</text>';
  }
  if(lo<0&&hi>0)o+='<line class="zl" x1="'+pl+'" y1="'+Y(0).toFixed(1)+'" x2="'+(pl+iw)+'" y2="'+Y(0).toFixed(1)+'"/>';
  var nb=series.filter(function(s){return s.type!=='line';}).length,bi=0;
  series.forEach(function(s){
    if(s.type==='line')return;
    var bw=Math.max(1.4,slot*0.72/Math.max(1,nb));
    var off=nb>1?(bi-(nb-1)/2)*bw:0;
    s.vals.forEach(function(v,i){
      if(!isN(v))return;
      var y0=Y(0),y1=Y(Number(v));
      var top=Math.min(y0,y1),bh=Math.max(1,Math.abs(y1-y0));
      o+='<rect x="'+(X(i)-bw/2+off).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)
        +'" fill="'+s.color+'" opacity="'+(s.op||0.8)+'"><title>'+esc(cats[i]+' '+s.name+' '+v)+'</title></rect>';
    });
    bi++;
  });
  series.forEach(function(s){
    if(s.type!=='line')return;
    o+='<path d="'+pathOf(s.vals,X,Y)+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||1.8)+'"'
      +(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
    s.vals.forEach(function(v,i){
      if(!isN(v))return;
      o+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(Number(v)).toFixed(1)+'" r="1.9" fill="'+s.color+'">'
        +'<title>'+esc(cats[i]+' '+s.name+' '+v)+'</title></circle>';
    });
  });
  o+='<line class="ax" x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(pl+iw)+'" y2="'+(pt+ih)+'"/>';
  var k=Math.ceil(n/12);
  cats.forEach(function(c,i){
    if(i%k&&i!==n-1)return;
    o+='<text x="'+X(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(c)+'</text>';
  });
  if(opt.tip)o+='<text class="ttl" x="'+(pl+iw)+'" y="'+(pt-3)+'" text-anchor="end">'+esc(opt.tip)+'</text>';
  return o+'</svg>';
}
/** 区间涨跌幅：把窗口内各日 pct 连乘 */
function cumSeries(days,key){
  var c=1,out=[];
  days.forEach(function(x){
    var p=(x[key]&&isN(x[key].pct))?Number(x[key].pct):null;
    if(p!=null)c*=(1+p/100);
    out.push((c-1)*100);
  });
  return out;
}

function renderTrend(d){
  var h=RV.history,html='';
  if(!h||!h.days||h.days.length<2){
    html+='<div class="card"><h3>多日大盘趋势</h3><div class="empty">还没有多日历史数据。<br>'
      +'运行 <code>node tools/fetch-history.cjs --days 40</code> 生成 <code>data/history.js</code> 后刷新本页。</div></div>';
    $('#p-trend').innerHTML=html;return;
  }
  var total=h.days.length;
  var win=Number(RV.ui.trendWin||20);
  if(win>total)win=total;
  var days=h.days.slice(-win);
  var cats=days.map(function(x){return fmtMD(x.date);});
  var sIdx=[
    {key:'sh',name:'上证指数',color:'#4c8dff',type:'line',vals:cumSeries(days,'sh')},
    {key:'sz',name:'深证成指',color:'#e8a33d',type:'line',vals:cumSeries(days,'sz')},
    {key:'cyb',name:'创业板指',color:'#22c1c3',type:'line',vals:cumSeries(days,'cyb')}
  ];
  var sAmt=[
    {name:'两市成交额(亿)',color:'#4c8dff',type:'bar',vals:days.map(function(x){return isN(x.totalAmount)?Number(x.totalAmount):null;}),op:0.72},
    {name:'5日均值',color:'#e8a33d',type:'line',vals:ma(h.days.map(function(x){return isN(x.totalAmount)?Number(x.totalAmount):null;}),5).slice(-win),dash:'4 3'}
  ];
  var sBr=[
    {name:'上涨家数',color:'#f2464a',type:'bar',vals:days.map(function(x){return (x.breadth&&isN(x.breadth.up))?Number(x.breadth.up):null;}),op:0.85},
    {name:'下跌家数',color:'#12b57f',type:'bar',vals:days.map(function(x){return (x.breadth&&isN(x.breadth.down))?-Number(x.breadth.down):null;}),op:0.85}
  ];
  var sLc=[],sLu=[],locN=0,locMiss=0;
  days.forEach(function(x){
    var ld=RV.days[x.date];
    if(ld){
      var ss=computeSentiment(ld);
      var lu=isN(ld.sentiment.limitUpCount)?Number(ld.sentiment.limitUpCount):null;
      sLc.push(ss.score==null?null:ss.score);sLu.push(lu);
      if(lu!=null||ss.score!=null)locN++;else locMiss++;
    }
    else{sLc.push(null);sLu.push(null);}
  });

  // ── 区间读数条
  var lastAmt=sAmt[0].vals.filter(function(v){return v!=null;});
  var avgAmt=lastAmt.length?lastAmt.reduce(function(a,b){return a+b;},0)/lastAmt.length:null;
  var lastPct=sIdx.map(function(s){return s.vals[s.vals.length-1];});
  var upN=days.filter(function(x){return x.breadth&&isN(x.breadth.up)&&isN(x.breadth.down)&&x.breadth.up>x.breadth.down;}).length;
  html+='<div class="segs"><span style="font-size:11px;color:var(--txt2)">区间</span>'
    +[10,20,30,60].filter(function(v){return v<=total;}).map(function(v){
        return '<button data-win="'+v+'" class="'+(v===win?'on':'')+'">近 '+v+' 日</button>';
      }).join('')
    +'<span class="sp">'+esc(h.from)+' ~ '+esc(h.to)+'（'+total+' 个交易日）· 源：'+esc(h.source||'iFinD')+'</span></div>';
  var amtChg=lastAmt.length>1?((lastAmt[lastAmt.length-1]/lastAmt[0]-1)*100):null;
  html+='<div class="card"><h3>区间读数 <span class="hint">'+esc(days[0].date)+' → '+esc(days[days.length-1].date)+'（'+win+' 个交易日）</span></h3>'
    +'<div class="stats">'
    +sIdx.map(function(s,i){
        var v=lastPct[i],ld=days[days.length-1][s.key];
        return '<div class="stat"><div class="k">'+esc(s.name)+' 区间涨跌幅</div>'
          +'<div class="v '+(v>=0?'up':'down')+'">'+(v>=0?'+':'')+v.toFixed(2)+'%</div>'
          +'<div class="s">收于 '+num(ld&&ld.close,2)+'</div></div>';
      }).join('')
    +'<div class="stat"><div class="k">日均两市成交</div><div class="v">'+(avgAmt==null?'—':num(avgAmt,0))+'</div><div class="s">亿元</div></div>'
    +'<div class="stat"><div class="k">单日成交最高 / 最低</div><div class="v">'+(lastAmt.length?num(Math.max.apply(null,lastAmt),0):'—')+'</div>'
      +'<div class="s">最低 '+(lastAmt.length?num(Math.min.apply(null,lastAmt),0):'—')+' 亿</div></div>'
    +'<div class="stat"><div class="k">成交额首尾变化</div><div class="v '+(amtChg==null?'':(amtChg>=0?'up':'down'))+'">'+(amtChg==null?'—':(amtChg>=0?'+':'')+amtChg.toFixed(1)+'%')+'</div>'
      +'<div class="s">'+(lastAmt.length?num(lastAmt[0],0)+' → '+num(lastAmt[lastAmt.length-1],0):'—')+'</div></div>'
    +'<div class="stat"><div class="k">上涨家数占优</div><div class="v">'+upN+' / '+days.length+'</div><div class="s">个交易日</div></div>'
    +'</div></div>';

  // ── ① 指数累计涨跌幅
  html+='<div class="card"><h3>指数累计涨跌幅 <span class="hint">以 '+esc(days[0].date)+' 收盘为 0%</span></h3>'
    +legendOf(sIdx.map(function(s,i){return {name:s.name+' '+(lastPct[i]>=0?'+':'')+lastPct[i].toFixed(2)+'%',color:s.color};}))
    +mkChart(cats,sIdx,{h:230,dp:1,yfmt:function(v){return v.toFixed(1)+'%';}})
    +'</div>';

  // ── ② 两市成交额 + 5 日均线
  html+='<div class="card"><h3>两市成交额与 5 日均线 <span class="hint">单位：亿元</span></h3>'
    +legendOf(sAmt.map(function(s){return {name:s.name,color:s.color};}))
    +mkChart(cats,sAmt,{h:210,yfmt:function(v){return Math.round(v/1000)+'k';}})
    +'</div>';

  // ── ③ 涨跌家数
  html+='<div class="card"><h3>涨跌家数 <span class="hint">红柱向上=上涨家数，绿柱向下=下跌家数</span></h3>'
    +legendOf(sBr.map(function(s){return {name:s.name,color:s.color};}))
    +mkChart(cats,sBr,{h:210,yfmt:function(v){return String(Math.abs(Math.round(v)));}})
    +'</div>';

  // ── ④ 情绪温度（需要逐日本地数据）
  html+='<div class="card"><h3>情绪温度 <span class="hint">涨停家数（柱）+ 情绪分（线）· 本地有效 '+locN+'/'+win+' 日</span></h3>';
  if(locN<2){
    html+='<div class="empty">本地只有 '+(locN||0)+' 天带涨停/情绪数据（<code>data/&lt;date&gt;.json</code>），'
      +'不足以画趋势。<br>每晚 19:00 的自动取数会逐日累积；也可以手工跑 <code>node tools/fetch.cjs --date YYYY-MM-DD</code> 补历史。</div>';
  }else{
    var sSen=[
      {name:'涨停家数',color:'#f2464a',type:'bar',vals:sLu,op:0.7},
      {name:'情绪分',color:'#e8a33d',type:'line',vals:sLc}
    ];
    html+=legendOf(sSen.map(function(s){return {name:s.name,color:s.color};}))
      +mkChart(cats,sSen,{h:210,dp:0});
    if(locMiss){
      html+='<div style="margin-top:10px;font-size:10.5px;color:var(--dim2)">有 '+locMiss+' 天本地文件在，但'
        +'<code>search_stocks</code> 配额受限拿不到涨停梯队，因此没有柱子（如 2026-09-29）。</div>';
    }
  }
  html+='</div>';

  // ── ⑤ 逐日明细
  html+='<div class="card"><h3>逐日明细 <span class="hint">'+win+' 个交易日 · 按日期升序</span></h3><div class="tw"><table class="tbl">'
    +'<thead><tr><th>日期</th><th>上证</th><th>涨跌幅</th><th>深证</th><th>涨跌幅</th><th>创业板</th><th>涨跌幅</th>'
    +'<th>两市成交(亿)</th><th>环比</th><th>上涨</th><th>下跌</th><th>涨停</th><th>情绪分</th></tr></thead><tbody>';
  days.forEach(function(x,i){
    var pv=i>0?(sAmt[0].vals[i-1]):null, cv=sAmt[0].vals[i];
    var chg=(pv&&cv)?((cv/pv-1)*100):null;
    var ld=RV.days[x.date];
    html+='<tr>'
      +'<td>'+esc(x.date)+'</td>'
      +'<td>'+num(x.sh&&x.sh.close,2)+'</td><td class="'+cls(x.sh&&x.sh.pct)+'">'+pct(x.sh&&x.sh.pct,2)+'</td>'
      +'<td>'+num(x.sz&&x.sz.close,2)+'</td><td class="'+cls(x.sz&&x.sz.pct)+'">'+pct(x.sz&&x.sz.pct,2)+'</td>'
      +'<td>'+num(x.cyb&&x.cyb.close,2)+'</td><td class="'+cls(x.cyb&&x.cyb.pct)+'">'+pct(x.cyb&&x.cyb.pct,2)+'</td>'
      +'<td>'+num(x.totalAmount)+'</td><td class="'+(chg==null?'dimv':cls(chg))+'">'+(chg==null?'—':(chg>=0?'+':'')+chg.toFixed(1)+'%')+'</td>'
      +'<td class="'+(x.breadth&&x.breadth.up>x.breadth.down?'up':'')+'">'+(x.breadth&&isN(x.breadth.up)?x.breadth.up:'—')+'</td>'
      +'<td>'+(x.breadth&&isN(x.breadth.down)?x.breadth.down:'—')+'</td>'
      +'<td>'+(ld&&isN(ld.sentiment.limitUpCount)?ld.sentiment.limitUpCount:'<span class="dimv">—</span>')+'</td>'
      +'<td>'+(ld?(function(){var q=computeSentiment(ld);return q.score==null?'<span class="dimv">—</span>':q.score;}()):'<span class="dimv">—</span>')+'</td>'
      +'</tr>';
  });
  html+='</tbody></table></div>'
    +'<div style="margin-top:10px;font-size:10.5px;color:var(--dim2)">指数与成交额取自 <code>data/history.js</code>（区间问法，休市日已按「涨跌幅为空」过滤）；'
    +'涨停家数与情绪分取自 <code>data/&lt;date&gt;.json</code>，未取过数的日子显示 <span class="dimv">—</span>。</div></div>';

  $('#p-trend').innerHTML=html;
  $$('#p-trend [data-win]').forEach(function(b){
    b.addEventListener('click',function(){
      RV.ui.trendWin=Number(b.dataset.win);saveUI();renderTrend(cur());
    });
  });
}

/* ═══════════ 交互绑定 ═══════════ */
function bind(){
  $('#dateSel').addEventListener('change',function(){RV.date=this.value;render();});
  $$('#tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      RV.ui.tab=b.dataset.tab;saveUI();renderTabs();
    });
  });
  $('#btnPrint').addEventListener('click',function(){window.print();});
  $('#btnExport').addEventListener('click',function(){
    var d=cur();
    var pack={exportedAt:new Date().toISOString(),app:'F(X)=Y的复盘工作台',schemaVersion:1,
      date:RV.date,day:JSON.parse(JSON.stringify(d)),notes:notesOf(RV.date)};
    delete pack.day._seed;
    var blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='复盘_'+RV.date+'.json';a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
    toast('已导出 复盘_'+RV.date+'.json');
  });
  $('#btnLoad').addEventListener('click',function(){$('#fileIn').click();});
  $('#fileIn').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result);
        var day=o.day||o;
        if(!day.date)throw new Error('缺少 date 字段');
        RV.days[day.date]=normDay(day);
        if(o.notes)RV.notes[day.date]=Object.assign(notesOf(day.date),o.notes);
        RV.order=Object.keys(RV.days).sort();
        RV.date=day.date;RV.origin='手动载入 '+f.name;
        saveNotes();render();toast('已载入 '+day.date);
      }catch(err){toast('载入失败：'+err.message);}
    };
    fr.readAsText(f,'utf-8');
    e.target.value='';
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      var t=e.target.tagName;
      if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
      var i=RV.order.indexOf(RV.date);
      var j=e.key==='ArrowLeft'?i-1:i+1;
      if(j>=0&&j<RV.order.length){RV.date=RV.order[j];render();}
    }
  });
}
boot().catch(function(e){
  console.error(e);
  $('#srcTxt').textContent='初始化失败';
  $('#srcBadge').className='badge warn';
});
})();
</script>
</body>
</html>
