      if(lu!=null||ss.score!=null)locN++;else locMiss++;
    }
    else{sLc.push(null);sLu.push(null);}
  });

  // ── 区间读数条
  var lastAmt=sAmt[0].vals.filter(function(v){return v!=null;});
  var avgAmt=lastAmt.length?lastAmt.reduce(function(a,b){return a+b;},0)/lastAmt.length:null;
  var lastPct=sIdx.map(function(s){return s.vals[s.vals.length-1];});
  var upN=days.filter(function(x){return x.breadth&&isN(x.breadth.up)&&isN(x.breadth.down)&&x.breadth.up>x.breadth.down;}).length;
  html+='<div class="segs"><span style="font-size:11px;color:var(--txt2)">区间</span>'
    +[10,20,30,60].filter(function(v){return v<=total;}).map(function(v){
        return '<button data-win="'+v+'" class="'+(v===win?'on':'')+'">近 '+v+' 日</button>';
      }).join('')
    +'<span class="sp">'+esc(h.from)+' ~ '+esc(h.to)+'（'+total+' 个交易日）· 源：'+esc(h.source||'iFinD')+'</span></div>';
  var amtChg=lastAmt.length>1?((lastAmt[lastAmt.length-1]/lastAmt[0]-1)*100):null;
  html+='<div class="card"><h3>区间读数 <span class="hint">'+esc(days[0].date)+' → '+esc(days[days.length-1].date)+'（'+win+' 个交易日）</span></h3>'
    +'<div class="stats">'
    +sIdx.map(function(s,i){
        var v=lastPct[i],ld=days[days.length-1][s.key];
        return '<div class="stat"><div class="k">'+esc(s.name)+' 区间涨跌幅</div>'
          +'<div class="v '+(v>=0?'up':'down')+'">'+(v>=0?'+':'')+v.toFixed(2)+'%</div>'
          +'<div class="s">收于 '+num(ld&&ld.close,2)+'</div></div>';
      }).join('')

/* ═══════════ 模式三 · 出监管套利（状态机） ═══════════ */
var P3M_KEY='rv:p3manual';
function p3Manual(){return lsGet(P3M_KEY,{});}
function p3ManualSave(code,field,val){var m=p3Manual();m[code]=m[code]||{};m[code][field]=val;lsSet(P3M_KEY,m);}

function renderPattern3(d){
  var p3=d.pattern3;
  if(!p3) return '';
  var c=p3.counts||{}, g=p3.gate||{ok:false,reasons:[]};
  var html='<div class="card" id="p3Card"><h3>模式三 · 出监管套利 <span class="hint">状态机 · 触发过异动 '+(c.tracked||0)+' 只 · 监控中 '+(c.monitoring||0)+' 只 · 买点 '+((c.buyLeft||0)+(c.buyRight||0))+' 个</span></h3>';

  if(g.ok){
    html+='<div class="p3gate ok">市场环境闸门 通过（近 5 日上涨家数占比均值 '+((g.breadth5==null?'—':(g.breadth5*100).toFixed(1)+'%'))+'）</div>';
  }else{
    html+='<div class="p3gate"><b>市场环境闸门 不通过</b><ul>'+ (g.reasons||[]).map(function(r){return '<li>'+esc(r)+'</li>';}).join('') +'</ul></div>';
  }

  html+='<div class="p3chips">'
    +'<span class="p3chip b"><b>'+(c.buyLeft||0)+'</b>左侧买点</span>'
    +'<span class="p3chip b"><b>'+(c.buyRight||0)+'</b>右侧买点</span>'
    +'<span class="p3chip q"><b>'+(c.monitoring||0)+'</b>监控中</span>'
    +'<span class="p3chip w"><b>'+(c.dead||0)+'</b>已失效</span>'
    +'</div>';

  html+='<div class="pdesc">逻辑：个股 10 日累计涨跌幅偏离值 ≥ +100%（或 30 日 ≥ +200%）触发严重异常波动 → 进入 <b>'+esc(p3.thresholds&&p3.thresholds.monitorDays||10)+' 个交易日</b>重点监控期；监管只是「暂时压制」，所以要做的是<b>弹簧未断裂</b>的票——监控期缩量横盘抗跌、回撤 10–15% 最优、单日无 &gt;5% 巨量阴线、板块梯队完整。<br>买点：<b>①左侧</b>＝监控第 3–5 天 + 收实体红 K 小仓试错；<b>②右侧</b>＝出监管日放量 + 承接扎实。规则来自《奇衡三交易模式》模式三。</div>';
  html+='<div class="pdesc" style="color:var(--dim)">⚠ 监管名单交易所不公开、iFinD 也取不到，本表用日 K 自行推算触发日（偏离值 = 个股日涨跌幅 − 基准指数日涨跌幅），与交易所口径可能有差异；监控时长原文为动态可调，这里按 '+esc(p3.thresholds&&p3.thresholds.monitorDays||10)+' 天估。</div>';

  var items=(p3.items||[]).slice(0,14);
  if(!items.length){
    html+='<div class="empty">当前没有处于监控期的标的。本模式一年机会很少（原文：标准 10–20%，只做「监控期预期修复 + 出监管脉冲」两段）。</div>';
  }else{
    html+='<table class="p3tbl"><thead><tr>'
      +'<th>股票</th><th>阶段</th><th>触发（条件·日期）</th><th>监控第N天</th><th>已回撤</th><th>量比</th><th>单日最大跌</th><th>企稳</th><th>买点 / 还差什么</th><th>人工确认</th>'
      +'</tr></thead><tbody>';
    var man=p3Manual();
    items.forEach(function(it){
      var cool=it.cool||{}, dd=cool.drawdown;
      var ddCls = cool.optimal?'best':(dd!=null&&dd>20?'warn':'');
      var cls = it.buy?'buy':(it.phase==='已失效'?'bad':(it.phase==='埋伏窗口'||it.phase==='出监管日'?'win':''));
      var phaseTxt = it.buy?('买点'+it.buy.signal):it.phase;
      var sig='';
      if(it.buy) sig='<span class="p3buy">✅ '+esc(it.buy.note)+'</span>';
      else if(it.toBuy&&it.toBuy.length) sig='<span style="color:var(--dim)">还差：'+it.toBuy.map(esc).join('；')+'</span>';
      else sig='<span style="color:var(--dim)">'+esc(it.phaseNote||'')+'</span>';
      var steady=[];
      if(cool.noNewLow2===true)steady.push('2日不创新低✓'); else if(cool.noNewLow2===false)steady.push('仍在创新低✗');
      else steady.push('低点—');
      if(cool.redBody===true)steady.push('实体红K✓'); else if(cool.redBody===false)steady.push('实体绿K✗');
      else steady.push('K线—');
      var m=man[it.code]||{};
      var mk=function(f,label){return '<label class="p1chk" title="'+esc(label)+'"><input type="checkbox" data-p3m="'+esc(it.code)+'|'+f+'"'+(m[f]?' checked':'')+'>'+esc(label)+'</label>';};
      html+='<tr>'
        +'<td><span class="nm">'+esc(it.name)+'</span><span class="cd">'+esc(it.code)+(it.industry?' · '+esc(it.industry):'')+'</span></td>'
        +'<td><span class="p3tag '+cls+'">'+esc(phaseTxt)+'</span></td>'
        +'<td>'+(it.trigger&&it.trigger.cond?esc(it.trigger.cond)+' ':(it.trigger&&it.trigger.dev!=null?(it.trigger.dev>0?'+':'')+num(it.trigger.dev,2)+'%':'')+' ')+(it.trigger&&it.trigger.date?esc(fmtMD(it.trigger.date)):'—')+'</td>'
        +'<td>'+(it.monitorDay!=null?esc(String(it.monitorDay))+' / '+esc(String(it.monitorTotal||10)):'—')+'</td>'
        +'<td class="dd '+ddCls+'">'+(dd==null?'—':num(dd,1)+'%')+'</td>'
        +'<td>'+(cool.shrinkRatio==null?'—':num(cool.shrinkRatio,2))+'</td>'
        +'<td>'+(cool.maxDrop1d==null?'—':num(cool.maxDrop1d,1)+'%')+'</td>'
        +'<td style="font-size:10.5px;color:var(--dim)">'+steady.join('<br>')+'</td>'
        +'<td style="text-align:left;white-space:normal;max-width:330px">'+sig+'</td>'
        +'<td class="p3man" style="text-align:left">'+mk('secondRegulation','二次监管')+mk('crowding','内卷')+mk('strictScale','尺度严')+'</td>'
        +'</tr>';
    });
    html+='</tbody></table>';
    if((p3.items||[]).length>items.length){
      html+='<div class="pmeta">另有 '+((p3.items||[]).length-items.length)+' 只排在后面（已失效/监控初期）。</div>';
    }
  }
  html+='<div class="pmeta">人工三项（二次监管记录 / 内卷程度 / 监管尺度）机器判断不了，勾选存本地浏览器（key <code>rv:p3manual</code>），不回写 data/。</div>';
  html+='</div>';
  return html;
}

    el.addEventListener('change',function(){
      var p=el.getAttribute('data-p3m').split('|');
      p3ManualSave(p[0],p[1],el.checked);
    });
  });

  h+='<div class="pdesc">偏离值 = 个股区间涨跌幅 − 基准指数区间涨跌幅；10 日累计 ≥100%、30 日累计 ≥200% 触发严重异动（主板 10 日内 4 次同向三日异动、双创 3 次即触发）。买点窗口 = 剩余缓冲 8~15 个点（原文：还没明牌、最佳试错）；临界 = 只剩 3~8 点（明牌，盈亏比差）。<b style="color:var(--gold)">⚠ 监管红线交易所不公示、iFinD 也取不到，本表全部用日 K 自行推算，与交易所口径可能有差异。</b></div>';

  if(!rows.length){
    h+='<div class="empty">本次没有接近红线的票（153 只候选里 10 日剩余缓冲都 >40 点）。<br>卡异动一年也没几次，空表是常态。</div></div>';

  }
  h+='<div class="p4wrap"><table class="tbl p4tbl"><thead><tr>'
    +'<th class="l">股票</th><th class="l">阶段</th><th>10日偏离 / 剩</th><th>30日剩</th><th>三日异动</th><th>量比</th><th>板块涨停</th><th class="l">龙虎榜</th><th class="l">买点 / 还差什么</th><th>人工确认</th>'

  rows.forEach(function(x){

      +'<td class="l"><div class="p4why">'+why.join('<br>')+'</div></td>'
      +'<td><div class="p4man">'
      +'<label class="p1chk"><input type="checkbox" data-p4m="'+esc(x.code)+'|tailPush"'+(mm.tailPush?' checked':'')+'>尾盘压盘</label>'
      +'<label class="p1chk"><input type="checkbox" data-p4m="'+esc(x.code)+'|crowded"'+(mm.crowded?' checked':'')+'>明牌拥挤</label>'
      +'<label class="p1chk"><input type="checkbox" data-p4m="'+esc(x.code)+'|chipClean"'+(mm.chipClean?' checked':'')+'>筹码干净</label>'
      +'</div></td>'
      +'</tr>';
  });
  h+='</tbody></table></div>';
  var rest=p.items.length-rows.length;
  h+='<div class="pmeta">'+(rest>0?'其余 '+rest+' 只还在观察名单（10 日剩余缓冲 >40 点，离红线还远）。':'')+'人工确认项保存在本地浏览器（key <span class="mono">rv:p4manual</span>），不回写 data。规则来自《奇衡三交易模式》模式四「卡异动战法」。</div></div>';
  return h;
}
function bindPattern4(){
  $$('#p-pick [data-p4m]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var parts=cb.getAttribute('data-p4m').split('|');
      p4ManualSave(parts[0],parts[1],cb.checked);
    });
  });
}
/* ═══════════ 交互绑定 ═══════════ */
function bind(){
  $('#dateSel').addEventListener('change',function(){RV.date=this.value;render();});
  $$('#tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      RV.ui.tab=b.dataset.tab;saveUI();renderTabs();
    });
  });
  $('#btnPrint').addEventListener('click',function(){window.print();});
  $('#btnExport').addEventListener('click',function(){
    var d=cur();
    var pack={exportedAt:new Date().toISOString(),app:'F(X)=Y的复盘工作台',schemaVersion:1,
      date:RV.date,day:JSON.parse(JSON.stringify(d)),notes:notesOf(RV.date)};
    delete pack.day._seed;
    var blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='复盘_'+RV.date+'.json';a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
    toast('已导出 复盘_'+RV.date+'.json');
  });
  $('#btnLoad').addEventListener('click',function(){$('#fileIn').click();});
  $('#fileIn').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result);
        var day=o.day||o;
        if(!day.date)throw new Error('缺少 date 字段');
        RV.days[day.date]=normDay(day);
        if(o.notes)RV.notes[day.date]=Object.assign(notesOf(day.date),o.notes);
        RV.order=Object.keys(RV.days).sort();
        RV.date=day.date;RV.origin='手动载入 '+f.name;
        saveNotes();render();toast('已载入 '+day.date);
      }catch(err){toast('载入失败：'+err.message);}
    };
    fr.readAsText(f,'utf-8');
    e.target.value='';
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      var t=e.target.tagName;
      if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
      var i=RV.order.indexOf(RV.date);
      var j=e.key==='ArrowLeft'?i-1:i+1;
      if(j>=0&&j<RV.order.length){RV.date=RV.order[j];render();}
    }
  });
}
boot().catch(function(e){
  console.error(e);
  $('#srcTxt').textContent='初始化失败';
  $('#srcBadge').className='badge warn';
});
})();
</script>
